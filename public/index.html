<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý shop Shopee</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #666666;
    --line: #d5d5d5;
    --accent: #1a1a1a;
    --warn-bg: #fff8e1;
    --warn-line: #e0c060;
    --ok-bg: #edf7ed;
    --ok-line: #8fbf8f;
    --err-bg: #fdecea;
    --err-line: #d98a80;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161616; --fg: #ececec; --muted: #a0a0a0; --line: #3a3a3a; --accent: #ececec;
      --warn-bg: #3a3320; --warn-line: #7a6a35;
      --ok-bg: #1f3020; --ok-line: #4a7a4a;
      --err-bg: #3a2220; --err-line: #8a4a44;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1060px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 18px;
  }
  .bar.ok  { background: var(--ok-bg);  border-color: var(--ok-line); }
  .bar.warn{ background: var(--warn-bg);border-color: var(--warn-line); }
  .bar.err { background: var(--err-bg); border-color: var(--err-line); }
  .bar .grow { flex: 1 1 auto; min-width: 200px; }
  button, .btn {
    font: inherit; padding: 7px 14px; border: 1px solid var(--accent); border-radius: 6px;
    background: var(--accent); color: var(--bg); cursor: pointer; text-decoration: none;
  }
  button.ghost, .btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: middle; text-align: center; }
  th { font-weight: 600; background: transparent; }
  td.name { text-align: left; max-width: 340px; }
  td.name small { color: var(--muted); display: block; }
  input[type=number] {
    font: inherit; width: 110px; padding: 5px 7px; text-align: right;
    border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg);
  }
  .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
  .muted { color: var(--muted); }
  .rowmsg { font-size: 12px; }
  .rowmsg.ok { color: #2e7d32; }
  .rowmsg.err { color: #c62828; }
  .pager { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 18px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }
  .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
  .tabs button { background: transparent; color: var(--muted); border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 14px; white-space: nowrap; }
  .tabs button.active { color: var(--fg); border-bottom-color: var(--fg); font-weight: 600; }
  .panel { border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.on { background: var(--ok-bg); border-color: var(--ok-line); }
  input[type=checkbox] { width: 18px; height: 18px; }
  @media (max-width: 720px) {
    td.name { max-width: none; }
    .thumb, .col-img { display: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Quản lý shop Shopee</h1>
  <p class="sub">Sửa giá và tồn kho trực tiếp. Mọi thay đổi được gửi thẳng lên Shopee.</p>

  <div id="bar" class="bar">
    <span class="grow">Đang kiểm tra kết nối...</span>
  </div>

  <nav id="tabs" class="tabs"></nav>
  <div id="content"></div>
</main>

<script>
const state = { offset: 0, pageSize: 20, hasNext: false, total: 0, boostIds: [] };

const el = (tag, props = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const child of [].concat(children)) {
    if (child != null) node.append(child);
  }
  return node;
};

const money = (value) =>
  typeof value === "number" ? value.toLocaleString("vi-VN") : "-";

async function api(path, options) {
  const res = await fetch(path, options);
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
  if (!res.ok) throw new Error(data.error || `Lỗi HTTP ${res.status}`);
  return data;
}

async function renderStatus() {
  const bar = document.getElementById("bar");
  bar.textContent = "";
  try {
    const s = await api("/auth/status");
    if (!s.connected) {
      bar.className = "bar warn";
      bar.append(
        el("span", { className: "grow", textContent: "Chưa kết nối shop nào." }),
        el("a", { className: "btn", href: "/auth/start", textContent: "Kết nối shop Shopee" }),
      );
      return false;
    }
    const lowRefresh = s.refreshTokenExpiresInDays <= 3;
    bar.className = lowRefresh ? "bar warn" : "bar ok";
    bar.append(
      el("span", {
        className: "grow",
        textContent:
          `Đã kết nối shop ${s.shopId}. ` +
          (s.accessTokenExpiresInMinutes > 0 ? `Mã truy cập còn ${s.accessTokenExpiresInMinutes} phút, ` : "Mã truy cập đã hết hạn, sẽ tự gia hạn khi dùng, ") +
          `mã gia hạn còn ${s.refreshTokenExpiresInDays} ngày.`,
      }),
      el("a", { className: "btn ghost", href: "/auth/start", textContent: "Ủy quyền lại" }),
    );
    return true;
  } catch (error) {
    bar.className = "bar err";
    bar.textContent = `Không đọc được tình trạng kết nối: ${error.message}`;
    return false;
  }
}

function productRow(item) {
  const msg = el("div", { className: "rowmsg" });
  const priceInput = el("input", { type: "number", min: "1", step: "1", value: item.original_price ?? "" });
  const stockInput = el("input", { type: "number", min: "0", step: "1", value: item.available_stock ?? "" });

  const save = async (kind) => {
    msg.className = "rowmsg muted";
    msg.textContent = "Đang lưu...";
    try {
      if (kind === "price") {
        await api(`/api/products/${item.item_id}/price`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ original_price: Number(priceInput.value) }),
        });
      } else {
        await api(`/api/products/${item.item_id}/stock`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ stock: Number(stockInput.value) }),
        });
      }
      msg.className = "rowmsg ok";
      msg.textContent = "Đã lưu lên Shopee.";
    } catch (error) {
      msg.className = "rowmsg err";
      msg.textContent = error.message;
    }
  };

  const priceBtn = el("button", { className: "ghost", textContent: "Lưu giá" });
  priceBtn.addEventListener("click", () => save("price"));
  const stockBtn = el("button", { className: "ghost", textContent: "Lưu tồn" });
  stockBtn.addEventListener("click", () => save("stock"));

  const hasModelNote = item.has_model
    ? el("small", { className: "muted", textContent: "Có phân loại: sửa ở đây chỉ áp dụng cho phân loại mặc định" })
    : null;

  const boostBox = el("input", { type: "checkbox", checked: state.boostIds.includes(item.item_id), title: "Đưa vào danh sách đẩy tự động" });
  boostBox.addEventListener("change", async () => {
    const next = boostBox.checked
      ? [...state.boostIds, item.item_id]
      : state.boostIds.filter((id) => id !== item.item_id);
    try {
      const saved = await api("/api/boost", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ itemIds: next }),
      });
      state.boostIds = saved.itemIds;
      msg.className = "rowmsg ok";
      msg.textContent = boostBox.checked ? "Đã thêm vào danh sách đẩy." : "Đã bỏ khỏi danh sách đẩy.";
    } catch (error) {
      boostBox.checked = !boostBox.checked;
      msg.className = "rowmsg err";
      msg.textContent = error.message;
    }
  });

  return el("tr", {}, [
    el("td", {}, boostBox),
    el("td", { className: "col-img" }, item.image ? el("img", { className: "thumb", src: item.image, alt: "" }) : ""),
    el("td", { className: "name" }, [
      el("span", { textContent: item.item_name ?? "(không tên)" }),
      el("small", { textContent: `Mã ${item.item_id}${item.item_sku ? " - SKU " + item.item_sku : ""}` }),
      hasModelNote,
    ]),
    el("td", {}, [priceInput, el("div", {}, priceBtn)]),
    el("td", {}, [
      stockInput,
      el("div", {}, stockBtn),
      item.reserved_stock
        ? el("small", { className: "muted", textContent: `Đang giữ cho khuyến mại: ${item.reserved_stock}` })
        : null,
    ]),
    el("td", {}, [el("div", { className: "muted", textContent: `Giá đang bán: ${money(item.current_price)}` }), msg]),
  ]);
}

async function renderProducts() {
  const content = document.getElementById("content");
  content.textContent = "";
  content.append(el("p", { className: "muted", textContent: "Đang tải danh sách sản phẩm..." }));

  try {
    const [data, boost] = await Promise.all([
      api(`/api/products?offset=${state.offset}&page_size=${state.pageSize}`),
      api("/api/boost/settings"),
    ]);
    state.boostIds = boost.itemIds;
    state.hasNext = data.has_next_page;
    state.total = data.total_count;
    content.textContent = "";

    if (!data.items.length) {
      content.append(el("div", { className: "empty", textContent: "Shop chưa có sản phẩm nào đang bán." }));
      return;
    }

    const head = el("tr", {}, ["Đẩy", "Ảnh", "Sản phẩm", "Giá gốc", "Tồn kho", "Ghi chú"].map((t) => el("th", { textContent: t, className: t === "Ảnh" ? "col-img" : "" })));
    const table = el("div", { className: "tablewrap" }, el("table", {}, [
      el("thead", {}, head),
      el("tbody", {}, data.items.map(productRow)),
    ]));

    const prev = el("button", { className: "ghost", textContent: "Trang trước", disabled: state.offset === 0 });
    prev.addEventListener("click", () => {
      state.offset = Math.max(0, state.offset - state.pageSize);
      renderProducts();
    });
    const next = el("button", { className: "ghost", textContent: "Trang sau", disabled: !state.hasNext });
    next.addEventListener("click", () => {
      state.offset = data.next_offset;
      renderProducts();
    });

    content.append(
      table,
      el("div", { className: "pager" }, [
        prev,
        el("span", { className: "muted", textContent: `Tổng ${state.total} sản phẩm` }),
        next,
      ]),
    );
  } catch (error) {
    content.textContent = "";
    content.append(el("div", { className: "empty", textContent: error.message }));
  }
}

const timeAgo = (ms) => {
  if (!ms) return "chưa bao giờ";
  const minutes = Math.round((Date.now() - ms) / 60000);
  if (minutes < 1) return "vừa xong";
  if (minutes < 60) return `${minutes} phút trước`;
  const hours = Math.floor(minutes / 60);
  return hours < 24 ? `${hours} giờ trước` : `${Math.floor(hours / 24)} ngày trước`;
};

async function renderBoost() {
  const content = document.getElementById("content");
  content.textContent = "";
  content.append(el("p", { className: "muted", textContent: "Đang tải trạng thái đẩy sản phẩm..." }));

  try {
    const b = await api("/api/boost");
    content.textContent = "";

    const toggle = el("button", { textContent: b.enabled ? "Tắt đẩy tự động" : "Bật đẩy tự động", className: b.enabled ? "ghost" : "" });
    toggle.addEventListener("click", async () => {
      toggle.disabled = true;
      try {
        await api("/api/boost", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: !b.enabled }),
        });
      } catch (error) {
        alert(error.message);
      }
      renderBoost();
    });

    const runNow = el("button", { className: "ghost", textContent: "Đẩy ngay" });
    const runMsg = el("span", { className: "muted" });
    runNow.addEventListener("click", async () => {
      runNow.disabled = true;
      runMsg.textContent = "Đang đẩy...";
      try {
        const r = await api("/api/boost/run", { method: "POST" });
        runMsg.textContent = r.message + (r.failed.length ? " Lỗi: " + r.failed.map((f) => `${f.itemId} (${f.reason})`).join("; ") : "");
        setTimeout(renderBoost, 1500);
      } catch (error) {
        runMsg.textContent = error.message;
        runNow.disabled = false;
      }
    });

    content.append(
      el("div", { className: "panel" }, [
        el("div", { className: "row" }, [
          el("span", { className: b.enabled ? "pill on" : "pill", textContent: b.enabled ? "Đang BẬT tự động" : "Đang TẮT tự động" }),
          el("span", { textContent: `Đang đẩy ${b.boostedNow.length}/${b.maxSlots} sản phẩm` }),
          el("span", { className: "grow" }),
          toggle,
          runNow,
        ]),
        el("p", { className: "muted", textContent:
          "Shopee cho đẩy tối đa 5 sản phẩm, mỗi lượt 4 giờ. Khi bật, cứ 10 phút hệ thống kiểm tra một lần: còn chỗ trống thì đẩy tiếp sản phẩm lâu chưa được đẩy nhất, xoay vòng cả danh sách. " +
          "Chỉ chạy khi máy chủ đang chạy (cửa sổ Terminal chạy máy chủ vẫn mở)." }),
        el("p", { className: "muted", textContent: `Lần chạy gần nhất: ${timeAgo(b.lastRunAt)}${b.lastResult ? " - " + b.lastResult : ""}` }),
        runMsg,
      ]),
    );

    if (!b.items.length) {
      content.append(el("div", { className: "empty", textContent: "Chưa chọn sản phẩm nào. Vào thẻ Sản phẩm, đánh dấu ô \"Đẩy\" ở những sản phẩm muốn đẩy." }));
      return;
    }

    const rows = b.items.map((item) => {
      const remove = el("button", { className: "ghost", textContent: "Bỏ khỏi danh sách" });
      remove.addEventListener("click", async () => {
        remove.disabled = true;
        try {
          await api("/api/boost", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ itemIds: b.items.map((x) => x.itemId).filter((id) => id !== item.itemId) }),
          });
        } catch (error) {
          alert(error.message);
        }
        renderBoost();
      });
      return el("tr", {}, [
        el("td", { className: "name" }, [el("span", { textContent: item.name }), el("small", { textContent: `Mã ${item.itemId}` })]),
        el("td", {}, item.remainingMinutes > 0
          ? el("span", { className: "pill on", textContent: `Đang đẩy, còn ${item.remainingMinutes} phút` })
          : el("span", { className: "pill", textContent: "Chờ lượt" })),
        el("td", { textContent: timeAgo(item.lastBoostedAt) }),
        el("td", {}, remove),
      ]);
    });

    content.append(el("div", { className: "tablewrap" }, el("table", {}, [
      el("thead", {}, el("tr", {}, ["Sản phẩm", "Trạng thái", "Lần đẩy gần nhất", ""].map((t) => el("th", { textContent: t })))),
      el("tbody", {}, rows),
    ])));
  } catch (error) {
    content.textContent = "";
    content.append(el("div", { className: "empty", textContent: error.message }));
  }
}

const TABS = [
  { id: "products", label: "Sản phẩm", render: renderProducts },
  { id: "boost", label: "Đẩy sản phẩm", render: renderBoost },
];

function readSavedTab() {
  try { return localStorage.getItem("tab"); } catch { return null; }
}

function showTab(id) {
  const tab = TABS.find((t) => t.id === id) ?? TABS[0];
  try { localStorage.setItem("tab", tab.id); } catch { /* trinh duyet chan luu tru, bo qua */ }
  const nav = document.getElementById("tabs");
  nav.textContent = "";
  for (const t of TABS) {
    const button = el("button", { textContent: t.label, className: t.id === tab.id ? "active" : "" });
    button.addEventListener("click", () => showTab(t.id));
    nav.append(button);
  }
  tab.render();
}

(async () => {
  if (await renderStatus()) showTab(readSavedTab());
})();
</script>
</body>
</html>
