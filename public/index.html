  @font-face { font-family: "Be Vietnam Pro"; font-weight: 400; font-display: swap; src: url(/fonts/be-vietnam-pro-vietnamese-400-normal.woff2) format("woff2"); unicode-range: U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB; }

  @font-face { font-family: "Be Vietnam Pro"; font-weight: 700; font-display: swap; src: url(/fonts/be-vietnam-pro-vietnamese-700-normal.woff2) format("woff2"); unicode-range: U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB; }

  /*
   * Giay vo trang, luoi o ly tim nhat, muc bi xanh cho du lieu va nut,
   * but do chi de ke le, gach so cu, bao loi va dong dau "Shop that".
   * --cover la cho mau thuong hieu Combi Home: khi co ma mau, chi can thay dong nay.
   */
  :root {
    --paper: #fbfcff;
    --grid: rgba(98, 86, 190, .045);
    --grid-strong: rgba(98, 86, 190, .11);
    --rule: #dcdfef;
    --rule-strong: #b7bcda;
    --print: #1b1d2a;
    --print-soft: #555a6b;
    --ink: #1f3fae;
    --ink-strong: #162f86;
    --ink-wash: rgba(31, 63, 174, .07);
    --on-ink: #ffffff;
    --select: rgba(31, 63, 174, .2);
    --red: #c42b28;
    --cover: #1c2b73;
    --cover-ink: #ffffff;
    --cover-tab: rgba(255, 255, 255, .14);
    --label: #ffffff;
    --label-shadow: 0 1px 2px rgba(15, 20, 60, .2), 0 8px 20px rgba(15, 20, 60, .18);
    --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* Shop thu nghiem: but chi thay muc, bia mau chi, con dau "Thu nghiem". */
  body[data-env="sandbox"] {
    --ink: #474c5c;
    --ink-strong: #30343f;
    --ink-wash: rgba(71, 76, 92, .08);
    --select: rgba(71, 76, 92, .2);
    --cover: #474c5c;
  }
  /* Che do toi: giay than cua phieu xuat kho. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #11152a;
      --grid: rgba(150, 165, 255, .03);
      --grid-strong: rgba(150, 165, 255, .07);
      --rule: #272d4b;
      --rule-strong: #414a78;
      --print: #e7e9f4;
      --print-soft: #a7acc5;
      --ink: #9fb3ff;
      --ink-strong: #c6d2ff;
      --ink-wash: rgba(159, 179, 255, .1);
      --on-ink: #0c1024;
      --select: rgba(159, 179, 255, .28);
      --red: #ff8f86;
      --cover: #070a1a;
      --cover-tab: rgba(255, 255, 255, .08);
      --label: #1a1f3a;
      --label-shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 20px rgba(0, 0, 0, .35);
    }
    :root:not([data-theme="light"]) body[data-env="sandbox"] {
      --ink: #c2c6d4;
      --ink-strong: #e0e2ea;
      --ink-wash: rgba(194, 198, 212, .1);
      --select: rgba(194, 198, 212, .25);
      --cover: #262935;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--paper);
    /* Vo o ly: o lon 32px ke dam, trong moi o ba dong ke manh cach 8px. */
    background-image:
      linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
      linear-gradient(var(--grid-strong) 1px, transparent 1px),
      linear-gradient(var(--grid) 1px, transparent 1px);
    background-size: 32px 32px, 32px 32px, 8px 8px;
    color: var(--print);
    font: 400 15px/1.6 var(--font);
    caret-color: var(--ink);
    scrollbar-color: var(--rule-strong) transparent;
  }
  ::selection { background: var(--select); color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  a { color: var(--ink); text-underline-offset: 3px; }
  h1, h2, p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .soft { color: var(--print-soft); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .icon { display: inline-flex; flex: none; }
  .icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Bia so va nhan vo ---------- */
  .cover {
    background-color: var(--cover);
    color: var(--cover-ink);
    padding: 24px 24px 0 72px;
  }
  .cover-inner { max-width: 1048px; margin: 0 auto; }
  .label {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px 16px;
    align-items: start;
    max-width: 620px;
    padding: 16px 20px;
    border-radius: 6px;
    background: var(--label);
    color: var(--print);
    box-shadow: var(--label-shadow);
    outline: 1px solid var(--rule-strong);
    outline-offset: -6px;
  }
  .shop { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; }
  .field-name { flex: none; font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--print-soft); }
  .fill { min-width: 0; padding: 0 4px 2px; border-bottom: 1px dotted var(--rule-strong); color: var(--ink); overflow-wrap: anywhere; }
  .fill.warn { color: var(--red); }
  .fill.wait { color: var(--print-soft); font-weight: 400; }
  .fields { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; font-size: 14px; }
  .field { display: inline-flex; align-items: baseline; gap: 6px; }
  .fields .fill { font-weight: 600; }
  .stamp {
    justify-self: end;
    padding: 2px 10px;
    border: 3px double currentColor;
    border-radius: 3px;
    color: var(--red);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    white-space: nowrap;
    transform: rotate(-4deg);
  }
  body[data-env="sandbox"] .stamp { color: var(--print-soft); }

  /* ---------- The chia trang ---------- */
  .tabs { display: flex; gap: 4px; margin-top: 20px; }
  .tab {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 0 16px;
    border: 0; border-radius: 6px 6px 0 0;
    background: var(--cover-tab); color: var(--cover-ink);
    font: 600 14px/1 var(--font); cursor: pointer;
    transition: background-color .15s ease-out;
  }
  .tab:hover { background: rgba(255, 255, 255, .24); }
  .tab[aria-current="page"] { background: var(--paper); color: var(--print); }
  .tab[aria-current="page"] .icon { color: var(--ink); }
  .tab:focus-visible { outline-color: var(--cover-ink); outline-offset: -4px; }
  .tab-short { display: none; }

  /* ---------- Trang so ---------- */
  .sheet {
    position: relative;
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px 24px 64px 72px;
  }
  .sheet::before {
    content: "";
    position: absolute; top: 0; bottom: 0; left: 48px;
    width: 1px; background: var(--red); opacity: .5;
  }
  .sheet-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 8px; }
  .sheet-head h2 { font-size: 20px; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; }
  .sheet-head .grow { flex: 1; }
  .env-note { margin-bottom: 16px; font-size: 13px; }
  .env-note.live { color: var(--red); font-weight: 500; }
  .banner { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; color: var(--ink); font-weight: 600; }
  .loading { padding: 32px 0; color: var(--print-soft); }
  .problem { display: grid; gap: 12px; justify-items: start; padding: 24px 0; color: var(--red); }
  .problem p { color: var(--print); }
  .empty { padding: 32px 0; display: grid; gap: 12px; justify-items: start; color: var(--print-soft); max-width: 60ch; }
  section + section { margin-top: 32px; }

  /* ---------- Nut ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 40px; padding: 0 16px;
    border: 1.5px solid var(--ink); border-radius: 4px;
    background: var(--ink); color: var(--on-ink);
    font: 600 14px/1 var(--font); text-decoration: none; cursor: pointer;
    transition: background-color .15s ease-out, border-color .15s ease-out;
  }
  .btn:hover { background: var(--ink-strong); border-color: var(--ink-strong); }
  .btn.line { background: transparent; color: var(--ink); }
  .btn.line:hover { background: var(--ink-wash); }
  .btn.sm { min-height: 32px; padding: 0 12px; font-size: 13px; }
  .btn:disabled, .link:disabled { opacity: .5; cursor: default; }
  .link {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 32px; padding: 0 4px;
    border: 0; background: none; color: var(--print-soft);
    font: 500 13px/1 var(--font); text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }
  .link:hover { color: var(--ink); }
  .link.ink { color: var(--ink); font-weight: 600; }

  /* ---------- Bang so ---------- */
  .ledger { width: 100%; border-collapse: collapse; }
  .ledger th {
    padding: 8px 12px; text-align: left;
    border-bottom: 2px solid var(--rule-strong);
    font-size: 12px; font-weight: 600; color: var(--print-soft); white-space: nowrap;
  }
  .ledger th.r { text-align: right; }
  .ledger td { padding: 16px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  .ledger tr:hover td { background: var(--ink-wash); }
  .c-img { width: 72px; }
  .thumb { display: block; width: 48px; height: 48px; object-fit: cover; border-radius: 3px; border: 1px solid var(--rule); background: var(--paper); }
  .name { font-weight: 600; line-height: 1.4; max-width: 44ch; }
  .meta { margin-top: 2px; font-size: 13px; color: var(--print-soft); }
  .c-price { width: 210px; }
  .c-stock { width: 160px; }
  .c-cost { width: 180px; }
  .c-boost { width: 96px; }
  .fix .meta .num { white-space: nowrap; }

  /* O sua so: so cu gach do, so moi viet muc xanh */
  .fix { display: grid; gap: 6px; justify-items: end; }
  .fix-row { display: flex; align-items: baseline; justify-content: flex-end; gap: 8px; width: 100%; }
  .fix-label, .leader { display: none; }
  .fix-line { display: inline-flex; align-items: baseline; gap: 6px; }
  .fix-old {
    display: none;
    color: var(--red); font-size: 13px; text-decoration: none;
    background: linear-gradient(var(--red), var(--red)) no-repeat 0 60% / 100% 1.5px;
  }
  .fix-old.draw { animation: strike .26s cubic-bezier(.16, 1, .3, 1) both; }
  @keyframes strike { from { background-size: 0% 1.5px; } to { background-size: 100% 1.5px; } }
  .fix[data-state="dirty"] .fix-old,
  .fix[data-state="saving"] .fix-old,
  .fix[data-state="error"] .fix-old,
  .fix[data-state="saved"] .fix-old { display: inline; }
  .fix-input {
    width: 9ch; padding: 4px 2px;
    border: 0; border-bottom: 1.5px solid var(--rule-strong); border-radius: 0;
    background: transparent; color: var(--print);
    font: 600 16px/1.3 var(--font); font-variant-numeric: tabular-nums; text-align: right;
  }
  .fix-input:hover { border-bottom-color: var(--ink); }
  .fix-input:focus { outline: none; border-bottom: 2px solid var(--ink); background: var(--ink-wash); }
  .fix[data-state="dirty"] .fix-input,
  .fix[data-state="error"] .fix-input,
  .fix[data-state="saved"] .fix-input { color: var(--ink); }
  .fix-unit { color: var(--print-soft); font-size: 13px; min-width: 1ch; }
  .fix-actions { display: none; gap: 4px; }
  .fix[data-state="dirty"] .fix-actions,
  .fix[data-state="saving"] .fix-actions,
  .fix[data-state="error"] .fix-actions { display: flex; }
  .fix-note { display: flex; align-items: flex-start; gap: 4px; max-width: 30ch; font-size: 12px; line-height: 1.45; text-align: right; }
  .fix-note:empty { display: none; }
  .fix .meta { margin: 0; text-align: right; }
  .fix-note .icon svg, .tick-note .icon svg { width: 16px; height: 16px; }
  .ok { color: var(--ink); }
  .err { color: var(--red); }

  /* O danh dau day */
  .tick-wrap { display: grid; justify-items: center; gap: 4px; }
  .tick { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 32px; cursor: pointer; }
  .tick input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .tick-box {
    display: inline-grid; place-items: center;
    width: 24px; height: 24px;
    border: 1.5px solid var(--rule-strong); border-radius: 3px;
    background: var(--paper); color: transparent;
    transition: border-color .15s ease-out;
  }
  .tick-box svg { width: 18px; height: 18px; stroke-width: 2.25; }
  .tick:hover .tick-box { border-color: var(--ink); }
  .tick input:checked + .tick-box { border-color: var(--ink); color: var(--ink); }
  .tick input:focus-visible + .tick-box { outline: 2px solid var(--ink); outline-offset: 2px; }
  .tick input:disabled + .tick-box { opacity: .5; }
  .tick-text { display: none; font-size: 14px; font-weight: 500; }
  .tick-note { display: flex; align-items: center; gap: 4px; font-size: 12px; text-align: center; white-space: nowrap; }
  .tick-note:empty { display: none; }

  .pager { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 24px; }

  /* ---------- Nam o day ---------- */
  .slots { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .slot {
    display: grid; align-content: start; gap: 6px;
    min-height: 124px; padding: 12px;
    border: 1.5px solid var(--ink); border-radius: 4px;
    background: var(--paper);
  }
  .slot.empty { border-style: dashed; border-color: var(--rule-strong); background: transparent; }
  .slot-no { font-size: 12px; font-weight: 600; color: var(--print-soft); }
  .slot-name { font-weight: 600; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .slot.empty .slot-name { color: var(--print-soft); font-weight: 400; }
  .slot-time { font-size: 13px; font-weight: 600; color: var(--ink); }
  .slot-bar { height: 4px; margin-top: auto; border-radius: 2px; background: var(--rule); overflow: hidden; }
  .slot-bar i { display: block; height: 100%; background: var(--ink); }

  .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
    padding: 16px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  }
  .controls .grow { flex: 1; }
  .switch { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; padding: 0; border: 0; background: none; color: var(--print); font: inherit; cursor: pointer; text-align: left; }
  .switch-track { position: relative; flex: none; width: 44px; height: 26px; border-radius: 13px; background: var(--rule-strong); transition: background-color .2s ease-out; }
  .switch-thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .2s cubic-bezier(.16, 1, .3, 1); }
  .switch[aria-checked="true"] .switch-track { background: var(--ink); }
  .switch[aria-checked="true"] .switch-thumb { transform: translateX(18px); }
  .switch-text { display: grid; line-height: 1.3; }
  .switch-text strong { font-weight: 600; }
  .switch-text span { font-size: 13px; color: var(--print-soft); }
  .switch[aria-checked="true"] .switch-text span { color: var(--ink); font-weight: 600; }
  .explain { margin-top: 12px; max-width: 72ch; font-size: 13px; color: var(--print-soft); }
  .run-note { margin-top: 8px; font-size: 14px; font-weight: 500; }
  .run-note:empty { display: none; }

  .state { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .mark { flex: none; width: 10px; height: 10px; border: 1.5px solid var(--ink); border-radius: 2px; }
  .mark.on { background: var(--ink); }
  .state.on { color: var(--ink); font-weight: 600; }
  .rot .c-state { width: 220px; }
  .rot .c-last { width: 170px; }
  .rot .c-act { width: 150px; text-align: right; }

  /* ---------- Tim, sap xep ---------- */
  .toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 8px; }
  .tool { display: grid; gap: 2px; }
  .tool.search { flex: 1 1 320px; max-width: 480px; }
  .tool-label { font-size: 12px; font-weight: 600; color: var(--print-soft); }
  .tool-field { position: relative; display: flex; align-items: center; gap: 8px; border-bottom: 1.5px solid var(--rule-strong); }
  .tool-field:hover { border-bottom-color: var(--ink); }
  .tool-field:focus-within { border-bottom: 2px solid var(--ink); background: var(--ink-wash); }
  .tool-field .icon { color: var(--print-soft); }
  .search-input, .sort-select {
    width: 100%; min-height: 40px; padding: 4px 2px;
    border: 0; border-radius: 0; background: transparent; color: var(--print);
    /* 16px: duoi muc nay iPhone tu phong to trang khi cham vao o nhap. */
    font: 500 16px/1.3 var(--font);
  }
  .search-input:focus, .sort-select:focus { outline: none; }
  .search-input::placeholder { color: var(--print-soft); opacity: .85; }
  .sort-select { appearance: none; -webkit-appearance: none; padding-right: 28px; cursor: pointer; }
  .sort-select option { background: var(--paper); color: var(--print); }
  .sort-select + .icon { position: absolute; right: 2px; pointer-events: none; }

  /* ---------- Dong phan loai ---------- */
  .sum { margin: 4px 0 0; text-align: right; font-weight: 600; }
  .sum-label { display: none; }
  .toggle { margin-top: 4px; padding-left: 0; }
  .toggle .icon svg { transition: transform .2s cubic-bezier(.16, 1, .3, 1); }
  .toggle[aria-expanded="true"] .icon svg { transform: rotate(180deg); }
  .model-row td { padding-top: 10px; padding-bottom: 10px; border-bottom: 1px dotted var(--rule-strong); }

<script>
const state = { status: null, boostIds: [], boostNote: null, catalog: null, costs: {}, query: "", sort: "recent", page: 1, pageSize: 30, open: new Set(), period: null };
let uid = 0;
let boostQueue = Promise.resolve();

const $ = (id) => document.getElementById(id);

function el(tag, props = {}, children = []) {
  const { attrs, ...rest } = props;
  const node = Object.assign(document.createElement(tag), rest);
  if (attrs) for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  for (const child of [].concat(children)) {
    if (child != null && child !== false) node.append(child);
  }
  return node;
}

const ICONS = {
  tag: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1 1 0 0 1 0 1.4l-7.3 7.3a1 1 0 0 1-1.4 0z"/><circle cx="8" cy="8" r="1.6"/></svg>',
  boost: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5V7"/><path d="M6.5 12.5 12 7l5.5 5.5"/><path d="M5 3.5h14"/></svg>',
  tick: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg>',
  cross: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5 12 15l5.5-5.5"/></svg>',
  search: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>',
  sheet: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/></svg>',
  upload: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5V4.5"/><path d="M7.5 9 12 4.5 16.5 9"/><path d="M4.5 15.5v3a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-3"/></svg>',
  download: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v11"/><path d="M7.5 11 12 15.5 16.5 11"/><path d="M4.5 15.5v3a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-3"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12h15M14 6.5l5.5 5.5-5.5 5.5"/></svg>',
  coins: '<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="9" cy="7" rx="5.5" ry="2.5"/><path d="M3.5 7v4c0 1.4 2.5 2.5 5.5 2.5"/><path d="M3.5 11v4c0 1.4 2.5 2.5 5.5 2.5"/><ellipse cx="15" cy="13" rx="5.5" ry="2.5"/><path d="M9.5 13v4c0 1.4 2.5 2.5 5.5 2.5s5.5-1.1 5.5-2.5v-4"/></svg>',
  chat: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.5h15a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-4.5 3.5v-3.5h-1a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5"/></svg>',
  reload: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5V9H15"/></svg>',
};
function icon(name) {
  const span = el("span", { className: "icon" });
  span.innerHTML = ICONS[name];
  return span;
}

const money = (value) => (typeof value === "number" ? value.toLocaleString("vi-VN") : "-");
const parseAmount = (text) => {
  const digits = String(text).replace(/[^\d]/g, "");
  return digits === "" ? NaN : Number(digits);
};
const clock = () => new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
const minutesText = (m) => (m >= 60 ? `${Math.floor(m / 60)} giờ ${m % 60} phút` : `${m} phút`);
const timeAgo = (ms) => {
  if (!ms) return "chưa bao giờ";
  const minutes = Math.round((Date.now() - ms) / 60000);
  if (minutes < 1) return "vừa xong";
  if (minutes < 60) return `${minutes} phút trước`;
  const hours = Math.floor(minutes / 60);
  return hours < 24 ? `${hours} giờ trước` : `${Math.floor(hours / 24)} ngày trước`;
};

async function api(path, options) {
  const res = await fetch(path, options);
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
  if (!res.ok) {
    // Shopee tu choi tung dong thi ly do nam trong failure_list: hien nguyen van.
    const reasons = (data.failure_list ?? []).map((f) => f.failed_reason).filter(Boolean);
    throw new Error(reasons.length ? reasons.join("; ") : data.error || `Lỗi HTTP ${res.status}`);
  }
  return data;
}
const send = (method, body) => ({ method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

function note(kind, text) {
  return [icon(kind === "ok" ? "tick" : "cross"), el("span", { textContent: text })];
}

function reloadButton(onClick) {
  const button = el("button", { type: "button", className: "link" }, [icon("reload"), "Tải lại"]);
  button.addEventListener("click", onClick);
  return button;
}

function problem(message, retry) {
  const box = el("div", { className: "problem", attrs: { role: "alert" } }, [
    el("p", {}, [el("strong", { className: "err", textContent: "Chưa tải được. " }), message]),
  ]);
  if (retry) {
    const again = el("button", { type: "button", className: "btn line sm", textContent: "Thử lại" });
    again.addEventListener("click", retry);
    box.append(again);
  }
  return box;
}

// ---------- Bia so ----------

function field(name, value, extraClass = "") {
  return el("span", { className: "field" }, [
    el("span", { className: "field-name", textContent: name }),
    el("span", { className: `fill num ${extraClass}`.trim(), textContent: value }),
  ]);
}

function setFavicon() {
  const cover = getComputedStyle(document.body).getPropertyValue("--cover").trim() || "#1c2b73";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="${cover}"/><rect x="6" y="9" width="20" height="12" rx="2" fill="#fff"/><path d="M9.5 13.5h13M9.5 17h8" stroke="${cover}" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  $("favicon").href = "data:image/svg+xml," + encodeURIComponent(svg);
}

  document.title = `${prefix}${shopName ? shopName + " - " : ""}Quản lý shop Shopee`;
}

  label.textContent = "";

  const name = !s.connected
    ? el("span", { className: "fill wait", textContent: "chưa kết nối" })

  label.append(

    label.append(el("p", { className: "fields" }, [

/**
 * Mot o sua gia hoac ton. Sua xong, so cu hien gach do, so moi viet muc xanh;
 * bam Luu (hoac Enter) moi gui len Shopee, Esc de tra lai so cu.
 */
function fixField({ label, unit, value, min, action, save, onSaved, extra, okText = () => `Shopee đã nhận lúc ${clock()}.`, failPrefix = "Shopee chưa nhận" }) {
  let saved = typeof value === "number" ? value : null;
  const id = `f${++uid}`;
  const wrap = el("div", { className: "fix" });
  wrap.dataset.state = "clean";

  const old = el("s", { className: "fix-old num" });
  const input = el("input", {
    id, className: "fix-input", type: "text", inputMode: "numeric", autocomplete: "off",
    value: saved == null ? "" : money(saved),
  });
  const saveBtn = el("button", { type: "button", className: "btn sm", textContent: action });
  const cancelBtn = el("button", { type: "button", className: "link", textContent: "Hủy" });
  const msg = el("p", { className: "fix-note", attrs: { role: "status" } });

  const show = (kind, text) => {
    msg.className = `fix-note ${kind}`;
    msg.replaceChildren(...note(kind, text));
  };
  const clear = () => { msg.className = "fix-note"; msg.textContent = ""; };
  const drawStrike = () => {
    old.classList.remove("draw");
    void old.offsetWidth;
    old.classList.add("draw");
  };

  input.addEventListener("input", () => {
    const v = parseAmount(input.value);
    const dirty = input.value.trim() !== "" && v !== saved;
    if (dirty) {
      if (wrap.dataset.state !== "dirty" && wrap.dataset.state !== "error") {
        old.textContent = saved == null ? "" : money(saved);
        drawStrike();
      }
      wrap.dataset.state = "dirty";
      clear();
    } else if (wrap.dataset.state !== "saved") {
      wrap.dataset.state = "clean";
      clear();
    }
  });
  input.addEventListener("blur", () => {
    const v = parseAmount(input.value);
    if (Number.isFinite(v)) input.value = money(v);
  });

  const revert = () => {
    input.value = saved == null ? "" : money(saved);
    wrap.dataset.state = "clean";
    clear();
  };

  const commit = async () => {
    const v = parseAmount(input.value);
    if (!Number.isInteger(v) || v < min) {
      wrap.dataset.state = "error";
      show("err", min > 0 ? "Nhập một số lớn hơn 0." : "Nhập một số từ 0 trở lên.");
      return;
    }
    wrap.dataset.state = "saving";
    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    input.readOnly = true;
    saveBtn.textContent = "Đang lưu...";
    try {
      await save(v);
      onSaved?.(v);
      old.textContent = saved == null ? "" : money(saved);
      saved = v;
      input.value = money(v);
      wrap.dataset.state = "saved";
      show("ok", okText());
    } catch (error) {
      wrap.dataset.state = "error";
      show("err", `${failPrefix}: ${error.message}`);
    } finally {
      saveBtn.disabled = false;
      cancelBtn.disabled = false;
      input.readOnly = false;
      saveBtn.textContent = action;
    }
  };

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && (wrap.dataset.state === "dirty" || wrap.dataset.state === "error")) {
      event.preventDefault();
      commit();
    } else if (event.key === "Escape") {
      revert();
    }
  });
  saveBtn.addEventListener("click", commit);
  cancelBtn.addEventListener("click", revert);

  wrap.append(...[
    el("div", { className: "fix-row" }, [
      el("label", { className: "fix-label", htmlFor: id, textContent: label }),
      el("span", { className: "leader", attrs: { "aria-hidden": "true" } }),
      el("span", { className: "fix-line" }, [old, input, el("span", { className: "fix-unit", textContent: unit })]),
    ]),
    el("div", { className: "fix-actions" }, [cancelBtn, saveBtn]),
    msg,
    extra ? el("p", { className: "meta" }, extra) : null,
  ].filter(Boolean));
  // Tren may tinh nhan o dau cot bang; ten o nhap van phai doc duoc.
  input.setAttribute("aria-label", label);
  return wrap;
}

function boostTick(item) {
  const input = el("input", { type: "checkbox", checked: state.boostIds.includes(item.itemId) });
  input.setAttribute("aria-label", `Đưa ${item.name} vào danh sách đẩy tự động`);
  const msg = el("span", { className: "tick-note", attrs: { role: "status" } });

  input.addEventListener("change", () => {
    const wanted = input.checked;
    input.disabled = true;
    // Xep hang tung lan luu de hai o bam lien nhau khong de mat nhau.
    boostQueue = boostQueue.then(async () => {
      const next = wanted
        ? [...new Set([...state.boostIds, item.itemId])]
        : state.boostIds.filter((id) => id !== item.itemId);
      try {
        const saved = await api("/api/boost", send("PUT", { itemIds: next }));
        state.boostIds = saved.itemIds;
        msg.className = "tick-note ok";
        msg.replaceChildren(...note("ok", wanted ? "Đã thêm" : "Đã bỏ"));
      } catch (error) {
        input.checked = !wanted;
        msg.className = "tick-note err";
        msg.replaceChildren(...note("err", error.message));
      } finally {
        input.disabled = false;
      }
    });
  });

  return el("div", { className: "tick-wrap" }, [
    el("label", { className: "tick" }, [
      input,
      el("span", { className: "tick-box", attrs: { "aria-hidden": "true" } }, icon("tick")),
      el("span", { className: "tick-text", attrs: { "aria-hidden": "true" }, textContent: "Đẩy tự động" }),
    ]),
    msg,
  ]);
}

/** Bo dau de tim "giay thom" ra "Giấy thơm". */
const fold = (text) =>
  String(text ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[đĐ]/g, "d").toLowerCase();

const SORTS = [
  { id: "recent", label: "Mới cập nhật trước" },
  { id: "name", label: "Tên A đến Z" },
  { id: "price-asc", label: "Giá thấp đến cao" },
  { id: "price-desc", label: "Giá cao đến thấp" },
  { id: "stock-asc", label: "Tồn ít đến nhiều" },
  { id: "stock-desc", label: "Tồn nhiều đến ít" },
];

function readPref(key, fallback) {
  try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; }
}
function writePref(key, value) {
  try { localStorage.setItem(key, value); } catch { /* trinh duyet chan luu tru, bo qua */ }
}

/** Tinh lai khoang gia, tong ton sau khi sua mot phan loai. */
function summarize(item) {
  const src = item.hasModel ? item.models : [item];
  const prices = src.map((m) => m.price).filter((x) => typeof x === "number");
  const stocks = src.map((m) => m.stock).filter((x) => typeof x === "number");
  item.priceMin = prices.length ? Math.min(...prices) : undefined;
  item.priceMax = prices.length ? Math.max(...prices) : undefined;
  item.stockTotal = stocks.length ? stocks.reduce((a, b) => a + b, 0) : undefined;
}

const range = (min, max) =>
  typeof min !== "number" ? "-" : min === max ? `${money(min)} ₫` : `${money(min)} - ${money(max)} ₫`;

function matches(item, words) {
  if (!words.length) return { hit: true, inModel: false };
  const own = fold(`${item.name} ${item.itemId} ${item.sku ?? ""}`);
  const models = item.models.map((m) => fold(`${m.name} ${m.modelId} ${m.sku ?? ""}`));
  const hay = `${own} ${models.join(" ")}`;
  const hit = words.every((w) => hay.includes(w));
  return { hit, inModel: hit && !words.every((w) => own.includes(w)) };
}

function sortItems(items, sort) {
  const list = [...items];
  const last = (v, dir) => (typeof v === "number" ? v : dir > 0 ? Infinity : -Infinity);
  const by = {
    name: (a, b) => a.name.localeCompare(b.name, "vi"),
    "price-asc": (a, b) => last(a.priceMin, 1) - last(b.priceMin, 1),
    "price-desc": (a, b) => last(b.priceMax, -1) - last(a.priceMax, -1),
    "stock-asc": (a, b) => last(a.stockTotal, 1) - last(b.stockTotal, 1),
    "stock-desc": (a, b) => last(b.stockTotal, -1) - last(a.stockTotal, -1),
  }[sort];
  return by ? list.sort(by) : list;
}

/** `sellEl`: o "Gia dang ban" cua dong. Khong dang giam gia thi gia ban doi theo gia goc. */
function priceField(item, model, sellEl) {
  const target = model ?? item;
  return fixField({
    label: "Giá gốc", unit: "₫", value: target.price, min: 1, action: "Lưu giá",
    extra: sellEl ? ["Đang bán ", sellEl] : null,
    save: (v) => api(`/api/products/${item.itemId}/price`, send("POST", { original_price: v, model_id: model ? model.modelId : 0 })),
    onSaved: (v) => {
      if (target.currentPrice === target.price) {
        target.currentPrice = v;
        if (sellEl) sellEl.textContent = `${money(v)} ₫`;
      }
      target.price = v;
      summarize(item);
      refreshSummary(item);
    },
  });
}

function stockField(item, model) {
  const target = model ?? item;
  return fixField({
    label: "Tồn kho", unit: "", value: target.stock, min: 0, action: "Lưu tồn",
    save: (v) => api(`/api/products/${item.itemId}/stock`, send("POST", { stock: v, model_id: model ? model.modelId : 0 })),
    onSaved: (v) => { target.stock = v; summarize(item); refreshSummary(item); },
    extra: target.reserved ? `Giữ cho khuyến mại: ${money(target.reserved)}` : null,
  });
}

/** Gia von chi luu tren may nay (khong gui Shopee), dung cho trang Tai chinh. */
function costField(item, model) {
  const key = `${item.itemId}:${model ? model.modelId : 0}`;
  return fixField({
    label: "Giá vốn", unit: "₫", value: state.costs[key], min: 0, action: "Lưu giá vốn",
    save: (v) => api("/api/costs", send("PUT", { itemId: item.itemId, modelId: model ? model.modelId : 0, cost: v })),
    onSaved: (v) => { state.costs[key] = v; refreshSummary(item); },
    okText: () => "Đã lưu trên máy này.",
    failPrefix: "Chưa lưu được",
  });
}

/** So phan loai da co gia von, hien tren dong san pham co phan loai. */
function costSummary(item) {
  const have = item.models.filter((m) => state.costs[`${item.itemId}:${m.modelId}`] !== undefined).length;
  return have === item.models.length ? "Đủ giá vốn" : `Thiếu ${item.models.length - have}/${item.models.length}`;
}

/** Cap nhat khoang gia, tong ton tren dong san pham sau khi sua mot phan loai. */
function refreshSummary(item) {
  const body = document.querySelector(`tbody[data-item="${item.itemId}"]`);
  if (!body || !item.hasModel) return;
  body.querySelector(".sum-price").textContent = range(item.priceMin, item.priceMax);
  body.querySelector(".sum-stock").textContent = typeof item.stockTotal === "number" ? money(item.stockTotal) : "-";
  const cost = body.querySelector(".sum-cost");
  if (cost) cost.textContent = costSummary(item);
}

function modelRow(item, m) {
  const sell = el("span", { className: "num", textContent: `${money(m.currentPrice)} ₫` });
  return el("tr", { className: "model-row" }, [
    el("td", { className: "c-img" }),
    el("td", { className: "c-name" }, [
      el("p", { className: "model-name", textContent: m.name }),
      el("p", { className: "meta num", textContent: `Mã phân loại ${m.modelId}${m.sku ? " · SKU " + m.sku : ""}` }),
    ]),
    el("td", { className: "c-price" }, priceField(item, m, sell)),
    el("td", { className: "c-stock" }, stockField(item, m)),
    el("td", { className: "c-cost" }, costField(item, m)),
    el("td", { className: "c-boost" }),
  ]);
}

/** Moi san pham mot tbody: dong san pham, va cac dong phan loai khi mo ra. */
function productBody(item, openNow) {
  const body = el("tbody", { className: "item" });
  body.dataset.item = item.itemId;
  const nameCell = el("td", { className: "c-name" }, [
    el("p", { className: "name", textContent: item.name }),
    el("p", { className: "meta num", textContent: `Mã ${item.itemId}${item.sku ? " · SKU " + item.sku : ""}` }),
    item.problem ? el("p", { className: "meta err", textContent: item.problem }) : null,
  ]);

  let priceCell, stockCell, costCell, sellText;
  const sell = el("span", { className: "num" });
  if (item.hasModel) {
    priceCell = el("td", { className: "c-price" }, el("p", { className: "sum" }, [
      el("span", { className: "sum-label", textContent: "Giá gốc " }),
      el("span", { className: "sum-price num", textContent: range(item.priceMin, item.priceMax) }),
    ]));
    stockCell = el("td", { className: "c-stock" }, el("p", { className: "sum" }, [
      el("span", { className: "sum-label", textContent: "Tổng tồn " }),
      el("span", { className: "sum-stock num", textContent: typeof item.stockTotal === "number" ? money(item.stockTotal) : "-" }),
    ]));
    const cur = item.models.map((m) => m.currentPrice).filter((x) => typeof x === "number");
    sellText = cur.length ? range(Math.min(...cur), Math.max(...cur)) : "-";
    priceCell.append(el("p", { className: "meta" }, ["Đang bán ", sell]));
    costCell = el("td", { className: "c-cost" }, el("p", { className: "sum" }, [
      el("span", { className: "sum-label", textContent: "Giá vốn " }),
      el("span", { className: "sum-cost", textContent: costSummary(item) }),
    ]));
  } else {
    priceCell = el("td", { className: "c-price" }, priceField(item, null, sell));
    stockCell = el("td", { className: "c-stock" }, stockField(item));
    costCell = el("td", { className: "c-cost" }, costField(item));
    sellText = `${money(item.currentPrice)} ₫`;
  }

  sell.textContent = sellText;
  body.append(el("tr", { className: "item-row" }, [
    el("td", { className: "c-img" }, item.image
      ? el("img", { className: "thumb", src: item.image, alt: "", loading: "lazy" })
      : el("span", { className: "thumb" })),
    nameCell,
    priceCell,
    stockCell,
    costCell,
    el("td", { className: "c-boost" }, boostTick(item)),
  ]));

  if (item.hasModel && item.models.length) {
    const toggle = el("button", { type: "button", className: "link ink toggle" }, [
      icon("chevron"),
      el("span", { textContent: `${item.models.length} phân loại` }),
    ]);
    let rows = null;
    // Chi nho khi nguoi dung tu bam; mo tu dong luc tim thi khong giu lai.
    const setOpen = (open, remember) => {
      if (open && !rows) {
        rows = item.models.map((m) => modelRow(item, m));
        body.append(...rows);
      }
      rows?.forEach((r) => { r.hidden = !open; });
      toggle.setAttribute("aria-expanded", String(open));
      toggle.lastChild.textContent = open ? `Ẩn ${item.models.length} phân loại` : `Sửa ${item.models.length} phân loại`;
      if (remember) {
        if (open) state.open.add(item.itemId); else state.open.delete(item.itemId);
      }
    };
    toggle.addEventListener("click", () => setOpen(toggle.getAttribute("aria-expanded") !== "true", true));
    nameCell.append(toggle);
    setOpen(openNow, false);
  }
  return body;
}

function renderList() {
  const box = $("list");
  if (!box || !state.catalog) return;
  const words = fold(state.query).split(/\s+/).filter(Boolean);
  const found = [];
  for (const item of state.catalog.items) {
    const m = matches(item, words);
    if (m.hit) found.push({ item, open: m.inModel || state.open.has(item.itemId) });
  }
  const sorted = sortItems(found.map((f) => f.item), state.sort);
  const openIds = new Set(found.filter((f) => f.open).map((f) => f.item.itemId));
  const pages = Math.max(1, Math.ceil(sorted.length / state.pageSize));
  state.page = Math.min(state.page, pages);
  const slice = sorted.slice((state.page - 1) * state.pageSize, state.page * state.pageSize);

  $("count").textContent = words.length
    ? `Tìm thấy ${money(sorted.length)} / ${money(state.catalog.items.length)} sản phẩm`
    : `${money(state.catalog.items.length)} sản phẩm`;

  if (!slice.length) {
    box.replaceChildren(el("div", { className: "empty" }, el("p", {
      textContent: words.length ? `Không có sản phẩm nào khớp "${state.query.trim()}".` : "Shop chưa có sản phẩm nào đang bán.",
    })));
    return;
  }

  const parts = [el("table", { className: "ledger products" }, [
    el("thead", {}, el("tr", {}, [
      el("th", { attrs: { scope: "col" } }, el("span", { className: "sr", textContent: "Ảnh" })),
      el("th", { attrs: { scope: "col" }, textContent: "Sản phẩm" }),
      el("th", { className: "r", attrs: { scope: "col" }, textContent: "Giá gốc" }),
      el("th", { className: "r", attrs: { scope: "col" }, textContent: "Tồn kho" }),
      el("th", { className: "r", attrs: { scope: "col" }, textContent: "Giá vốn" }),
      el("th", { attrs: { scope: "col" }, textContent: "Đẩy" }),
    ])),
    ...slice.map((item) => productBody(item, openIds.has(item.itemId))),
  ])];

  if (pages > 1) {
    const go = (page) => { state.page = page; renderList(); $("content").scrollIntoView({ block: "start" }); };
    const prev = el("button", { type: "button", className: "btn line sm", textContent: "Trang trước", disabled: state.page === 1 });
    prev.addEventListener("click", () => go(state.page - 1));
    const next = el("button", { type: "button", className: "btn line sm", textContent: "Trang sau", disabled: state.page === pages });
    next.addEventListener("click", () => go(state.page + 1));
    parts.push(el("div", { className: "pager" }, [prev, el("span", { className: "soft num", textContent: `Trang ${state.page}/${pages}` }), next]));
  }
  box.replaceChildren(...parts);
}

async function renderProducts(force = false) {
  const content = $("content");
  content.replaceChildren(el("p", { className: "loading", textContent: force || !state.catalog
    ? "Đang tải toàn bộ sản phẩm và phân loại từ Shopee, shop nhiều sản phẩm có thể mất vài chục giây..."
    : "Đang mở danh sách..." }));
  try {
    const [catalog, boost, costs] = await Promise.all([
      !force && state.catalog ? state.catalog : api(`/api/catalog${force ? "?refresh=1" : ""}`),
      api("/api/boost/settings"),
      api("/api/costs"),
    ]);
    state.catalog = catalog;
    state.costs = costs;
    state.boostIds = boost.itemIds;

    const loaded = new Date(catalog.loadedAt).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
    const head = el("div", { className: "sheet-head" }, [
      el("h2", { textContent: "Sản phẩm đang bán" }),
      el("p", { className: "soft num" }, [el("span", { id: "count" }), ` · số liệu lúc ${loaded}`]),
      el("span", { className: "grow" }),
      reloadButton(() => renderProducts(true)),
    ]);
    const envNote = state.status.sandbox

async function renderBoost() {
  const content = $("content");
  content.replaceChildren(el("p", { className: "loading", textContent: "Đang xem các ô đẩy trên Shopee..." }));
  try {
    const b = await api("/api/boost");

    const slots = [];
    for (let i = 0; i < b.maxSlots; i++) {
      const s = b.boostedNow[i];
      if (!s) {
        slots.push(el("li", { className: "slot empty" }, [
          el("span", { className: "slot-no", textContent: `Ô ${i + 1}` }),
          el("span", { className: "slot-name", textContent: "Ô trống" }),
        ]));
        continue;
      }
      const bar = el("i");
      bar.style.width = `${Math.min(100, (s.remainingMinutes / 240) * 100)}%`;
      slots.push(el("li", { className: "slot" }, [
        el("span", { className: "slot-no", textContent: `Ô ${i + 1}` }),
        el("span", { className: "slot-name", textContent: s.name || `Sản phẩm mã ${s.itemId}` }),
        el("span", { className: "slot-time num", textContent: `còn ${minutesText(s.remainingMinutes)}` }),
        el("span", { className: "slot-bar", attrs: { "aria-hidden": "true" } }, bar),
      ]));
    }

    const toggle = el("button", {
      type: "button", className: "switch", attrs: { role: "switch", "aria-checked": String(b.enabled) },
    }, [
      el("span", { className: "switch-track", attrs: { "aria-hidden": "true" } }, el("span", { className: "switch-thumb" })),
      el("span", { className: "switch-text" }, [
        el("strong", { textContent: "Tự động đẩy" }),
        el("span", { textContent: b.enabled ? "Đang bật" : "Đang tắt" }),
      ]),
    ]);
    const runNote = el("p", { className: "run-note", attrs: { role: "status" } });
    if (state.boostNote) {
      runNote.className = `run-note ${state.boostNote.kind}`;
      runNote.textContent = state.boostNote.text;
      state.boostNote = null;
    }
    toggle.addEventListener("click", async () => {
      toggle.disabled = true;
      try {
        await api("/api/boost", send("PUT", { enabled: !b.enabled }));
        renderBoost();
      } catch (error) {
        toggle.disabled = false;
        runNote.className = "run-note err";
        runNote.textContent = error.message;
      }
    });

    const runNow = el("button", { type: "button", className: "btn line", textContent: "Đẩy ngay" });
    runNow.addEventListener("click", async () => {
      runNow.disabled = true;
      runNow.textContent = "Đang đẩy...";
      try {
        const r = await api("/api/boost/run", { method: "POST" });
        // Ket qua thanh cong da hien o dong "Lan chay gan nhat"; chi can noi them khi co san pham loi.
        if (r.failed.length) {
          state.boostNote = { kind: "err", text: "Không đẩy được: " + r.failed.map((f) => `mã ${f.itemId} (${f.reason})`).join("; ") + "." };
        }
        renderBoost();
      } catch (error) {
        runNote.className = "run-note err";
        runNote.textContent = error.message;
        runNow.disabled = false;
        runNow.textContent = "Đẩy ngay";
      }
    });

    const used = b.boostedNow.length;
    const head = el("div", { className: "sheet-head" }, [
      el("h2", { className: "num", textContent: `Đang đẩy ${used}/${b.maxSlots} ô` }),
      el("p", { className: "soft", textContent: "Mỗi lượt đẩy kéo dài 4 giờ." }),
      el("span", { className: "grow" }),
      reloadButton(renderBoost),
    ]);

    const every = b.checkMinutes > 0 ? `cứ ${b.checkMinutes} phút` : "định kỳ";
    const controls = el("section", {}, [
      el("h2", { className: "sr", textContent: "Cài đặt đẩy" }),
      el("div", { className: "controls" }, [toggle, runNow]),
      el("p", { className: "explain", textContent: `Khi bật, ${every} hệ thống xem còn ô trống không; còn thì đẩy tiếp sản phẩm lâu chưa được đẩy nhất trong danh sách, xoay vòng hết lượt. Chỉ chạy khi máy chủ đang chạy (cửa sổ Terminal còn mở).` }),
      el("p", { className: "explain" }, [
        "Lần chạy gần nhất: ",

        el("h2", { textContent: "Danh sách xoay vòng" }),

          el("th", { attrs: { scope: "col" } }, el("span", { className: "sr", textContent: "Thao tác" })),
        ])),
        el("tbody", {}, b.items.map((item) => {
          const remove = el("button", { type: "button", className: "link", textContent: "Bỏ khỏi danh sách" });
          remove.addEventListener("click", async () => {
            remove.disabled = true;
            try {
              await api("/api/boost", send("PUT", { itemIds: b.items.map((x) => x.itemId).filter((id) => id !== item.itemId) }));
              state.boostNote = { kind: "ok", text: `Đã bỏ "${item.name}" khỏi danh sách.` };

          return el("tr", {}, [

function renderBulk() {
  const content = $("content");
  const fileInput = el("input", { type: "file", id: "bulk-file", className: "sr", accept: ".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const drop = el("div", { className: "dropzone" }, [
    el("p", { textContent: "Kéo tệp .xlsx đã sửa vào đây, hoặc" }),
    el("label", { className: "btn line", htmlFor: "bulk-file" }, [icon("upload"), "Chọn tệp đã sửa"]),
    fileInput,
  ]);
  const preview = el("div", { id: "preview" });

  const take = (file) => { if (file) previewFile(file, preview); };
  fileInput.addEventListener("change", () => { take(fileInput.files[0]); fileInput.value = ""; });
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    take(e.dataTransfer.files[0]);
  });

  content.replaceChildren(
    el("div", { className: "sheet-head" }, [el("h2", { textContent: "Sửa giá, tồn hàng loạt bằng Excel" })]),

      el("li", {}, [
        el("p", {}, [el("strong", { textContent: "Tải tệp giá, tồn hiện tại. " }), "Mỗi sản phẩm hoặc mỗi phân loại là một dòng, có sẵn giá và tồn đang bán."]),
        el("a", { className: "btn", href: "/api/excel/template", download: "" }, [icon("download"), "Tải tệp Excel"]),
      ]),
      el("li", {}, el("p", {}, [el("strong", { textContent: "Điền cột nền xanh nhạt " }), '"Giá gốc mới", "Tồn kho mới", "Giá vốn". Ô để trống là giữ nguyên. Không sửa cột mã. Giá vốn chỉ lưu trên máy này để tính lãi lỗ, không gửi Shopee.'])),
      el("li", {}, [el("p", {}, [el("strong", { textContent: "Tải tệp lên để xem trước. " }), "Chưa có gì được gửi lên Shopee cho tới khi anh chị bấm Áp dụng."]), drop]),

}

async function previewFile(file, box) {
  box.replaceChildren(el("p", { className: "loading", textContent: `Đang đọc "${file.name}" và so với số liệu Shopee lúc này...` }));
  try {
    const res = await fetch("/api/excel/preview", { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: file });
    const data = await res.json().catch(() => ({ error: `Lỗi HTTP ${res.status}` }));
    if (!res.ok) throw new Error(data.error || `Lỗi HTTP ${res.status}`);
    showPreview(file.name, data, box);
  } catch (error) {
    box.replaceChildren(problem(error.message));
  }
}

function showPreview(fileName, data, box) {
  const parts = [];
  parts.push(el("p", { className: "summary num" }, [
    `Đã đọc ${money(data.rowsRead)} dòng trong "${fileName}": `,
    el("strong", { className: "ok", textContent: `${money(data.changes.length)} dòng thay đổi` }),
    `, ${money(data.unchanged)} dòng giữ nguyên`,
    data.problems.length ? ", " : ".",
    data.problems.length ? el("strong", { className: "err", textContent: `${money(data.problems.length)} dòng lỗi (không áp dụng).` }) : null,
  ]));

  if (data.problems.length) {
    parts.push(el("section", { className: "problems" }, [
      el("h3", { textContent: "Dòng lỗi" }),
      el("ul", {}, data.problems.map((p) => el("li", {}, [icon("cross"), el("span", {}, [el("strong", { className: "num", textContent: `Dòng ${p.row}: ` }), p.message])]))),
    ]));
  }

  if (!data.changes.length) {
    parts.push(el("div", { className: "empty" }, el("p", { textContent: "Không có dòng nào cần đổi. Kiểm tra đã điền cột Giá gốc mới, Tồn kho mới và lưu tệp chưa." })));
    box.replaceChildren(...parts);
    return;
  }

  const checks = new Map();
  const resultCells = new Map();
  const all = el("input", { type: "checkbox", checked: true });
  all.setAttribute("aria-label", "Chọn tất cả");

  const cell = (oldV, newV, unit) => newV === undefined
    ? el("span", { className: "soft num", textContent: typeof oldV === "number" ? `${money(oldV)}${unit}` : "-" })
    : el("span", { className: "change num" }, [
        el("s", { className: "fix-old", textContent: typeof oldV === "number" ? money(oldV) : "-" }),
        el("span", { className: "arrow", attrs: { "aria-hidden": "true" } }, icon("arrow")),
        el("span", { className: "new", textContent: `${money(newV)}${unit}` }),
      ]);

  const rows = data.changes.map((c) => {
    const pick = el("input", { type: "checkbox", checked: true });
    pick.setAttribute("aria-label", `Chọn dòng ${c.row}: ${c.name}${c.modelName ? " - " + c.modelName : ""}`);
    checks.set(c.key, pick);
    const result = el("td", { className: "c-result" });
    resultCells.set(c.key, result);
    return el("tr", {}, [
      el("td", { className: "c-pick" }, el("label", { className: "tick" }, [pick, el("span", { className: "tick-box", attrs: { "aria-hidden": "true" } }, icon("tick"))])),
      el("td", { className: "c-name" }, [
        el("p", { className: "name", textContent: c.name }),
        c.modelName ? el("p", { className: "model-name", textContent: c.modelName }) : null,
        el("p", { className: "meta num", textContent: `Dòng ${c.row} trong tệp` }),
        ...c.warnings.map((w) => el("p", { className: "meta err" }, [el("strong", { textContent: "Kiểm tra lại: " }), w])),
      ]),
      el("td", { className: "c-price" }, cell(c.oldPrice, c.newPrice, " ₫")),
      el("td", { className: "c-stock" }, cell(c.oldStock, c.newStock, "")),
      el("td", { className: "c-cost" }, cell(c.oldCost, c.newCost, " ₫")),
      result,
    ]);
  });

  const applyBtn = el("button", { type: "button", className: "btn" });
  const progress = el("div", { className: "progress", hidden: true }, [
    el("span", { className: "slot-bar" }, el("i")),
    el("p", { className: "run-note num", attrs: { role: "status" } }),
  ]);
  const chosen = () => data.changes.filter((c) => checks.get(c.key).checked);
  let armed = false;
  let armTimer = 0;
  const label = () => {
    const n = chosen().length;
    applyBtn.disabled = n === 0;
    applyBtn.textContent = armed
      ? `Bấm lần nữa để đổi ${n} dòng trên shop thật`
      : `Áp dụng ${n} thay đổi`;
    applyBtn.classList.toggle("armed", armed);
  };
  checks.forEach((b) => b.addEventListener("change", () => {
    all.checked = [...checks.values()].every((x) => x.checked);
    armed = false;
    label();
  }));
  all.addEventListener("change", () => { checks.forEach((b) => { b.checked = all.checked; }); armed = false; label(); });

  applyBtn.addEventListener("click", async () => {
    // Shop that: bam hai lan moi gui, tranh bam nham.
    if (!data.sandbox && !armed) {
      armed = true;
      label();
      clearTimeout(armTimer);
      armTimer = setTimeout(() => { armed = false; label(); }, 6000);
      return;
    }
    clearTimeout(armTimer);
    const list = chosen();
    applyBtn.disabled = true;
    applyBtn.textContent = "Đang gửi lên Shopee...";
    all.disabled = true;
    checks.forEach((b) => { b.disabled = true; });
    progress.hidden = false;
    try {
      const { jobId, total } = await api("/api/excel/apply", send("POST", { previewId: data.previewId, keys: list.map((c) => c.key) }));
      await follow(jobId, total, resultCells, progress);
      state.catalog = null; // trang San pham tai lai so moi
      applyBtn.remove();
    } catch (error) {
      progress.querySelector(".run-note").className = "run-note err";
      progress.querySelector(".run-note").textContent = error.message;
      applyBtn.textContent = "Chọn lại tệp để thử lại";
    }
  });
  label();

  parts.push(
    el("table", { className: "ledger changes" }, [
      el("thead", {}, el("tr", {}, [
        el("th", { attrs: { scope: "col" } }, el("label", { className: "tick" }, [all, el("span", { className: "tick-box", attrs: { "aria-hidden": "true" } }, icon("tick"))])),
        el("th", { attrs: { scope: "col" }, textContent: "Sản phẩm, phân loại" }),
        el("th", { className: "r", attrs: { scope: "col" }, textContent: "Giá gốc" }),
        el("th", { className: "r", attrs: { scope: "col" }, textContent: "Tồn kho" }),
        el("th", { className: "r", attrs: { scope: "col" }, textContent: "Giá vốn" }),
        el("th", { attrs: { scope: "col" }, textContent: "Kết quả" }),
      ])),
      el("tbody", {}, rows),
    ]),
    el("div", { className: "apply-bar" }, [
      data.sandbox
        ? el("p", { className: "env-note soft", textContent: "Shop thử nghiệm: áp dụng thoải mái." })
        : el("p", { className: "env-note live", textContent: "Shop thật: sau khi áp dụng, khách mua thấy giá, tồn mới ngay." }),
      applyBtn,
      progress,
    ]),
  );
  box.replaceChildren(...parts);
}

/** Hoi tien do cho toi khi xong, dien ket qua vao tung dong. */
async function follow(jobId, total, resultCells, progress) {
  const bar = progress.querySelector("i");
  const text = progress.querySelector(".run-note");
  let shown = 0;
  for (;;) {
    const job = await api(`/api/excel/jobs/${jobId}`);
    for (const r of job.results.slice(shown)) {
      const cell = resultCells.get(r.key);
      if (cell) {
        cell.append(el("p", { className: `fix-note ${r.ok ? "ok" : "err"}` },
          note(r.ok ? "ok" : "err", `${{ price: "Giá", stock: "Tồn", cost: "Giá vốn" }[r.field]}: ${r.ok ? (r.field === "cost" ? "đã lưu" : "Shopee đã nhận") : r.message}`)));
      }
    }
    shown = job.results.length;
    bar.style.width = `${total ? Math.round((shown / total) * 100) : 100}%`;
    const failed = job.results.filter((r) => !r.ok).length;
    text.textContent = job.finished
      ? `Xong: ${shown - failed} thay đổi Shopee đã nhận${failed ? `, ${failed} bị từ chối (xem cột Kết quả)` : ""}.`
      : `Đã gửi ${shown}/${total} thay đổi...`;
    text.className = `run-note ${job.finished && failed ? "err" : job.finished ? "ok" : ""}`;
    if (job.finished) return;
    await new Promise((resolve) => setTimeout(resolve, 700));
  }
}

/** Ngay YYYY-MM-DD theo gio Ha Noi. */
const hnDay = (ms = Date.now()) => new Date(ms + 7 * 3600 * 1000).toISOString().slice(0, 10);
const addDays = (day, n) => new Date(Date.parse(`${day}T00:00:00Z`) + n * 86400000).toISOString().slice(0, 10);
const viDay = (day) => { const [y, m, d] = day.split("-"); return `${d}/${m}/${y}`; };
const shortDay = (day) => { const [, m, d] = day.split("-"); return `${d}/${m}`; };
const signed = (v) => (v < 0 ? `-${money(-v)}` : money(v));
const two = (x) => String(x).padStart(2, "0");
/** "08:37 ngay 28/09" theo gio may nguoi dung. */
const when = (ms) => { const d = new Date(ms); return `${two(d.getHours())}:${two(d.getMinutes())} ngày ${two(d.getDate())}/${two(d.getMonth() + 1)}`; };
const pct = (a, b) => (b ? `${(Math.round((a / b) * 1000) / 10).toLocaleString("vi-VN")}%` : "-");

const PERIODS = [
  { id: "7", label: "7 ngày qua", range: (t) => [addDays(t, -6), t] },
  { id: "30", label: "30 ngày qua", range: (t) => [addDays(t, -29), t] },
  { id: "month", label: "Tháng này", range: (t) => [`${t.slice(0, 7)}-01`, t] },
  { id: "last-month", label: "Tháng trước", range: (t) => {
    const first = `${t.slice(0, 7)}-01`;
    const end = addDays(first, -1);
    return [`${end.slice(0, 7)}-01`, end];
  } },
  { id: "custom", label: "Tự chọn", range: null },
];

function currentPeriod() {
  if (!state.period) {
    const saved = readPref("finance-period", "30");
    const p = PERIODS.find((x) => x.id === saved && x.range) ?? PERIODS[1];
    const [from, to] = p.range(hnDay());
    state.period = { id: p.id, from, to };
  }
  return state.period;
}

/** Dong so: nhan ben trai, dong cham dan, so ben phai. */
function line(label, value, opts = {}) {
  return el("div", { className: `ln${opts.total ? " total" : ""}${opts.sub ? " sub" : ""}` }, [
    el("span", { className: "ln-label" }, label),
    el("span", { className: "ln-leader", attrs: { "aria-hidden": "true" } }),
    el("span", { className: `ln-value num${opts.neg ? " err" : ""}` }, value),
    // Cot ti le luon co mat (co the trong) de cac so thang cot.
    el("span", { className: "ln-note num" }, opts.note ?? ""),
  ]);
}

async function renderFinance(autoSync = true) {
  const content = $("content");
  const period = currentPeriod();
  content.replaceChildren(el("p", { className: "loading", textContent: "Đang mở sổ tài chính..." }));

  const [report, overview] = await Promise.all([
    api(`/api/finance/report?from=${period.from}&to=${period.to}`).catch((e) => ({ error: e.message })),
    api("/api/finance/overview").catch((e) => ({ error: e.message })),
  ]);
  if (report.error) {
    content.replaceChildren(problem(report.error, () => renderFinance(false)));
    return;
  }

  // Thanh chon ky
  const select = el("select", { id: "period", className: "sort-select" },
    PERIODS.map((p) => el("option", { value: p.id, textContent: p.label, selected: p.id === period.id })));
  const fromIn = el("input", { type: "date", id: "from", className: "date-input", value: period.from, max: hnDay() });
  const toIn = el("input", { type: "date", id: "to", className: "date-input", value: period.to, max: hnDay() });
  const custom = el("span", { className: "custom-range", hidden: period.id !== "custom" }, [
    el("label", { className: "tool" }, [el("span", { className: "tool-label", textContent: "Từ ngày" }), el("span", { className: "tool-field" }, fromIn)]),
    el("label", { className: "tool" }, [el("span", { className: "tool-label", textContent: "Đến ngày" }), el("span", { className: "tool-field" }, toIn)]),
  ]);
  select.addEventListener("change", () => {
    const p = PERIODS.find((x) => x.id === select.value);
    if (p.range) {
      const [from, to] = p.range(hnDay());
      state.period = { id: p.id, from, to };
      writePref("finance-period", p.id);
      renderFinance();
    } else {
      custom.hidden = false;
      state.period = { ...state.period, id: "custom" };
    }
  });
  const applyCustom = () => {
    if (fromIn.value && toIn.value && fromIn.value <= toIn.value) {
      state.period = { id: "custom", from: fromIn.value, to: toIn.value };
      renderFinance();
    }
  };
  fromIn.addEventListener("change", applyCustom);
  toIn.addEventListener("change", applyCustom);

  const syncBtn = el("button", { type: "button", className: "btn line" }, [icon("reload"), "Lấy số liệu mới từ Shopee"]);
  const syncBox = el("div", { className: "sync-box", attrs: { role: "status" } });
  syncBtn.addEventListener("click", () => runSync(period, syncBtn, syncBox));

  const synced = report.syncedAt ? `số liệu lấy lúc ${when(report.syncedAt)}` : "chưa lấy số liệu";

  const parts = [
    el("div", { className: "sheet-head" }, [
      el("h2", { textContent: "Tài chính" }),
      el("p", { className: "soft num", textContent: `${viDay(period.from)} đến ${viDay(period.to)} · ${synced}` }),
    ]),
    el("div", { className: "toolbar" }, [
      el("label", { className: "tool" }, [el("span", { className: "tool-label", textContent: "Kỳ xem" }), el("span", { className: "tool-field" }, [select, icon("chevron")])]),
      custom,
      el("span", { className: "grow" }),
      syncBtn,
    ]),
    syncBox,
  ];

  const key = `${period.from}:${period.to}`;
  // Chi tu lay lai khi con ngay chua lay don. Ngay thieu tien da ve, vi khong tinh:
  // shop chua duoc cap quyen Payment thi hai phan nay lan nao cung loi, se tu lay mai.
  const willSync = autoSync && report.missingDays.length > 0 && !state.autoSynced?.has(key);
  if (report.missingDays.length && !willSync) {
    parts.push(el("p", { className: "env-note live", textContent: `Còn ${report.missingDays.length} ngày trong kỳ chưa có số liệu đơn hàng. Bấm "Lấy số liệu mới từ Shopee".` }));
  }

  parts.push(moneySection(report, overview), statementSection(report), dailySection(report), productSection(report), orderSection(report), walletSection(report));
  content.replaceChildren(...parts);

  // Lan dau mo mot ky chua co so lieu: tu lay, khong bat nguoi dung bam.
  if (willSync) {
    (state.autoSynced ??= new Set()).add(key);
    runSync(period, syncBtn, syncBox);
  }
}

async function runSync(period, button, box) {
  button.disabled = true;
  box.replaceChildren(el("p", { className: "loading num", textContent: "Đang lấy số liệu từ Shopee..." }));
  try {
    const { jobId } = await api("/api/finance/sync", send("POST", { from: period.from, to: period.to }));
    for (;;) {
      const job = await api(`/api/finance/jobs/${jobId}`);
      box.firstChild.textContent = job.message;
      if (job.finished) {
        const failed = job.steps.filter((s) => !s.ok);
        if (failed.length) {
          state.syncProblems = failed;
        } else {
          state.syncProblems = null;
        }
        renderFinance(false);
        return;
      }
      await new Promise((resolve) => setTimeout(resolve, 800));
    }
  } catch (error) {
    button.disabled = false;
    box.replaceChildren(problem(error.message, () => runSync(period, button, box)));
  }
}

const PAYMENT_HINT = 'Bấm "Lấy số liệu mới từ Shopee" để lấy lại; phần này cần ứng dụng được Shopee cấp quyền Payment.';

/**
 * Tien da ve, vi chua lay du cac ngay trong ky (loi, vd thieu quyen Payment, hoac
 * tep luu tu ban cu): tong cong duoc chi la mot phan nen khong hien nhu so that.
 * Tra ve chu hien thay cho so va cau noi da lay duoc bao nhieu ngay; du thi null.
 * May chu ban cu (chua khoi dong lai sau khi cap nhat) khong gui danh sach nay.
 */
function shortfall(report, missingDays) {
  if (!missingDays?.length) return null;
  const total = report.daily.length;
  if (missingDays.length >= total) return { value: "chưa có số liệu", got: "chưa lấy được ngày nào trong kỳ", partial: false };
  return { value: "chưa đủ số liệu", got: `mới lấy được ${total - missingDays.length}/${total} ngày trong kỳ`, partial: true };
}

/**
 * Ghi chu duoi phan chua du ngay. Lan lay vua roi buoc `step` loi thi noi luon ly
 * do Shopee bao thay cho loi nhac chung, va danh sach loi o muc Tien khong lap lai.
 */
function shortfallNote(step, label, short, extra = "") {
  const reason = state.syncProblems?.find((s) => s.name === step)?.message;
  const tail = reason ? `Lần lấy vừa rồi Shopee báo: ${reason}` : PAYMENT_HINT;
  return el("p", { className: "meta err" }, [el("strong", { textContent: `${label}: ` }), `${short.got}${extra}. ${tail}`]);
}

function moneySection(report, overview) {
  const w = report.wallet;
  const released = shortfall(report, report.releasedMissingDays);
  const rows = [
    line("Đang chờ Shopee đối soát (tất cả đơn)", overview.error ? "không lấy được" : `${money(overview.pending ?? 0)} ₫`, { neg: Boolean(overview.error) }),
    line("Đã về ví trong kỳ", released ? released.value : `${money(report.releasedInPeriod)} ₫`, { neg: Boolean(released) }),
    line("Số dư ví Shopee", typeof w.balance === "number" ? `${money(w.balance)} ₫` : "-"),
  ];
  const notes = [];
  if (released) notes.push(shortfallNote("Tiền đã về", "Tiền đã về", released, released.partial ? `, các ngày đó cộng lại ${money(report.releasedInPeriod)} ₫` : ""));
  if (w.balanceAt) notes.push(el("p", { className: "meta", textContent: `Số dư theo giao dịch ví gần nhất, lúc ${when(w.balanceAt * 1000)}.` }));
  if (overview.error) notes.push(el("p", { className: "meta err", textContent: overview.error }));
  // Loi cua phan dang thieu ngay da noi trong ghi chu cua phan do (o tren, o muc Vi).
  const told = new Set([released ? "Tiền đã về" : null, shortfall(report, report.walletMissingDays) ? "Ví Shopee" : null]);
  for (const s of (state.syncProblems ?? []).filter((p) => !told.has(p.name))) {
    notes.push(el("p", { className: "meta err" }, [el("strong", { textContent: `${s.name}: ` }), s.message]));
  }
  return el("section", { className: "fin" }, [el("h3", { textContent: "Tiền" }), el("div", { className: "lines" }, rows), ...notes]);
}
