/** Bieu do cot: thuc nhan tung ngay. Mot chuoi so, mot mau, co o tro va bang so. */
function dailySection(report) {
  const days = report.daily;
  const max = Math.max(0, ...days.map((d) => d.net));
  const min = Math.min(0, ...days.map((d) => d.net));
  const section = el("section", { className: "fin" }, [el("h3", { textContent: "Thực nhận theo ngày" })]);
  if (!days.some((d) => d.orders)) {
    section.append(el("p", { className: "empty", textContent: "Chưa có số liệu để vẽ." }));
    return section;
  }
  const W = 720, H = 220, L = 64, B = 24, T = 12;
  const plotW = W - L - 8, plotH = H - B - T;
  const step = niceStep((max - min) / 4 || 1);
  const top = Math.ceil(max / step) * step || step;
  const bottom = Math.floor(min / step) * step;
  const y = (v) => T + ((top - v) / (top - bottom)) * plotH;
  const slot = plotW / days.length;
  const barW = Math.max(2, Math.min(24, slot - 2));
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("class", "chart");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `Biểu đồ thực nhận theo ngày từ ${viDay(report.from)} đến ${viDay(report.to)}; số từng ngày ở bảng bên dưới.`);
  const add = (tag, attrs, text) => {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (text != null) node.textContent = text;
    svg.append(node);
    return node;
  };
  for (let v = bottom; v <= top + 1e-6; v += step) {
    add("line", { x1: L, x2: W - 8, y1: y(v), y2: y(v), class: v === 0 ? "axis" : "grid" });
    add("text", { x: L - 8, y: y(v) + 4, class: "tick", "text-anchor": "end" }, compact(v));
  }
  const labelEvery = Math.ceil(days.length / 8);
  const tip = el("div", { className: "chart-tip", hidden: true });
  days.forEach((d, i) => {
    const x = L + i * slot + (slot - barW) / 2;
    if (d.net !== 0) {
      const y0 = y(0), y1 = y(d.net);
      const h = Math.max(1, Math.abs(y1 - y0));
      const r = Math.min(4, h, barW / 2);
      // Dau cot bo tron 4px, chan cot vuong tren duong 0.
      const up = d.net > 0;
      const yTop = up ? y1 : y0;
      const path = up
        ? `M${x},${y0} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + barW - r} Q${x + barW},${yTop} ${x + barW},${yTop + r} V${y0} Z`
        : `M${x},${y0} V${y1 - r} Q${x},${y1} ${x + r},${y1} H${x + barW - r} Q${x + barW},${y1} ${x + barW},${y1 - r} V${y0} Z`;
      add("path", { d: path, class: "bar" });
    }
    if (i % labelEvery === 0) add("text", { x: L + i * slot + slot / 2, y: H - 6, class: "tick", "text-anchor": "middle" }, shortDay(d.day));
    const hit = add("rect", { x: L + i * slot, y: T, width: slot, height: plotH, class: "hit", tabindex: "0" });
    const show = () => {
      tip.hidden = false;
      tip.replaceChildren(
        el("strong", { textContent: viDay(d.day) }),
        el("span", { className: "num", textContent: `${d.orders} đơn · thực nhận ${money(d.net)} ₫` }),
        el("span", { className: "num", textContent: d.profit === undefined ? "Lãi: thiếu giá vốn" : `Lãi gộp ${signed(d.profit)} ₫` }),
      );
      const box = svg.getBoundingClientRect();
      const left = ((L + i * slot + slot / 2) / W) * box.width;
      tip.style.left = `${Math.min(Math.max(left, 90), box.width - 90)}px`;
    };
    hit.addEventListener("mouseenter", show);
    hit.addEventListener("focus", show);
    hit.addEventListener("mouseleave", () => { tip.hidden = true; });
    hit.addEventListener("blur", () => { tip.hidden = true; });
  });

  const table = el("details", { className: "day-table" }, [
    el("summary", { textContent: "Xem số từng ngày" }),
    el("table", { className: "ledger mini" }, [
      el("thead", {}, el("tr", {}, ["Ngày", "Đơn", "Tiền hàng", "Thực nhận", "Lãi gộp"].map((t, i) => el("th", { className: i ? "r" : "", attrs: { scope: "col" }, textContent: t })))),
      el("tbody", {}, days.filter((d) => d.orders).reverse().map((d) => el("tr", {}, [
        el("td", { className: "num", textContent: viDay(d.day) }),
        el("td", { className: "r num", textContent: money(d.orders), attrs: { "data-label": "Đơn" } }),
        el("td", { className: "r num", textContent: money(d.goods), attrs: { "data-label": "Tiền hàng" } }),
        el("td", { className: "r num", textContent: money(d.net), attrs: { "data-label": "Thực nhận" } }),
        el("td", { className: `r num${(d.profit ?? 0) < 0 ? " err" : ""}`, textContent: d.profit === undefined ? "thiếu giá vốn" : signed(d.profit), attrs: { "data-label": "Lãi gộp" } }),
      ]))),
    ]),
  ]);
  section.append(el("div", { className: "chart-wrap" }, [svg, tip]), table);
  return section;
}

function niceStep(raw) {
  const pow = 10 ** Math.floor(Math.log10(raw));
  const n = raw / pow;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * pow;
}
const compact = (v) => {
  const a = Math.abs(v);
  const s = a >= 1e9 ? `${+(a / 1e9).toFixed(1)} tỷ` : a >= 1e6 ? `${+(a / 1e6).toFixed(1)} tr` : a >= 1e3 ? `${+(a / 1e3).toFixed(0)} k` : String(a);
  return (v < 0 ? "-" : "") + s.replace(".", ",");
};

function productSection(report) {
  const section = el("section", { className: "fin" }, [
    el("h3", { textContent: "Theo sản phẩm" }),
    el("p", { className: "meta", textContent: "Thực nhận của mỗi đơn chia cho từng sản phẩm theo tỷ lệ tiền hàng. Giá vốn sửa ngay tại đây, chỉ lưu trên máy này." }),
  ]);
  if (!report.products.length) {
    section.append(el("p", { className: "empty", textContent: "Chưa có sản phẩm bán ra trong kỳ." }));
    return section;
  }
  let limit = 20;
  const body = el("tbody");
  const more = el("button", { type: "button", className: "btn line sm" });
  const draw = () => {
    body.replaceChildren(...report.products.slice(0, limit).map((pr) => {
      const profitCell = el("td", { className: `c-profit r num${(pr.profit ?? 0) < 0 ? " err" : ""}`, textContent: pr.profit === undefined ? "thiếu giá vốn" : signed(pr.profit), attrs: { "data-label": "Lãi" } });
      const marginCell = el("td", { className: "c-margin r num", textContent: pr.profit === undefined ? "-" : pct(pr.profit, pr.net), attrs: { "data-label": "Tỷ suất" } });
      const cost = fixField({
        label: "Giá vốn", unit: "₫", value: pr.cost, min: 0, action: "Lưu",
        save: (v) => api("/api/costs", send("PUT", { itemId: pr.itemId, modelId: pr.modelId, cost: v })),
        onSaved: (v) => {
          state.costs[`${pr.itemId}:${pr.modelId}`] = v;
          pr.cost = v; pr.cogs = v * pr.qty; pr.profit = pr.net - pr.cogs;
          profitCell.textContent = signed(pr.profit);
          profitCell.classList.toggle("err", pr.profit < 0);
          marginCell.textContent = pct(pr.profit, pr.net);
          state.financeStale = true;
        },
        okText: () => "Đã lưu. Bấm Tải lại bảng kê để tính lại các đơn.",
        failPrefix: "Chưa lưu được",
      });
      return el("tr", {}, [
        el("td", { className: "c-name" }, [el("p", { className: "name", textContent: pr.name }), pr.modelName ? el("p", { className: "model-name", textContent: pr.modelName }) : null]),
        el("td", { className: "c-qty r num", textContent: money(pr.qty), attrs: { "data-label": "Đã bán" } }),
        el("td", { className: "c-goods r num", textContent: money(pr.goods), attrs: { "data-label": "Tiền hàng" } }),
        el("td", { className: "c-net r num", textContent: money(pr.net), attrs: { "data-label": "Thực nhận" } }),
        el("td", { className: "c-cost" }, cost),
        profitCell,
        marginCell,
      ]);
    }));
    more.hidden = limit >= report.products.length;
    more.textContent = `Xem thêm (còn ${report.products.length - limit})`;
  };
  more.addEventListener("click", () => { limit += 30; draw(); });
  draw();
  const reload = el("button", { type: "button", className: "link" }, [icon("reload"), "Tải lại bảng kê"]);
  reload.addEventListener("click", () => renderFinance(false));
  section.append(
    el("table", { className: "ledger fin-products" }, [
      el("thead", {}, el("tr", {}, ["Sản phẩm", "Đã bán", "Tiền hàng", "Thực nhận", "Giá vốn / cái", "Lãi", "Tỷ suất"].map((t, i) => el("th", { className: i ? "r" : "", attrs: { scope: "col" }, textContent: t })))),
      body,
    ]),
    el("div", { className: "row-actions" }, [more, reload]),
  );
  return section;
}

function orderSection(report) {
  const section = el("section", { className: "fin" }, [el("h3", { textContent: `Đơn hàng (${money(report.orders.length)})` })]);
  if (!report.orders.length) return section;
  let limit = 20;
  const body = el("tbody");
  const more = el("button", { type: "button", className: "btn line sm" });
  const detail = (o) => {
    const i = o.income;
    const minus = (v) => (v ? `-${money(v)}` : "0");
    return el("tr", { className: "order-detail", hidden: true }, el("td", { attrs: { colspan: "7" } }, el("div", { className: "lines" }, [
      ...o.lines.map((l) => line(`${l.name}${l.modelName ? " · " + l.modelName : ""} × ${l.qty}`, money(l.amount), { sub: true })),
      line("Tiền hàng", money(i.goods)),
      line("Mã giảm giá, xu của shop", minus(i.sellerVoucher), { sub: true }),
      line("Phí cố định, dịch vụ, thanh toán", minus(i.commission + i.service + i.transaction), { sub: true }),
      line("Phí khác", minus(i.otherFees), { sub: true }),
      line("Thuế khấu trừ", minus(i.tax), { sub: true }),
      line("Vận chuyển, trả hàng, điều chỉnh", signed(i.adjust), { sub: true }),
      line("Thực nhận", `${money(i.net)} ₫`, { total: true }),
    ])));
  };
  const draw = () => {
    const rows = [];
    for (const o of report.orders.slice(0, limit)) {
      const fees = o.income.sellerVoucher + o.income.commission + o.income.service + o.income.transaction + o.income.otherFees + o.income.tax;
      const d = detail(o);
      const toggle = el("button", { type: "button", className: "link ink toggle", attrs: { "aria-expanded": "false" } }, [icon("chevron"), el("span", { className: "num", textContent: o.sn })]);
      toggle.addEventListener("click", () => {
        d.hidden = !d.hidden;
        toggle.setAttribute("aria-expanded", String(!d.hidden));
      });
      rows.push(el("tr", {}, [
        el("td", { className: "c-sn" }, toggle),
        el("td", { className: "c-day num", textContent: shortDay(o.day) }),
        el("td", { className: "c-status" }, el("span", { className: o.final ? "state on" : "state" }, [el("span", { className: o.final ? "mark on" : "mark", attrs: { "aria-hidden": "true" } }), o.statusName])),
        el("td", { className: "c-goods r num", textContent: money(o.income.goods), attrs: { "data-label": "Tiền hàng" } }),
        el("td", { className: "c-fees r num", textContent: fees ? `-${money(fees)}` : "0", attrs: { "data-label": "Phí, thuế" } }),
        el("td", { className: "c-net r num", textContent: money(o.income.net), attrs: { "data-label": "Thực nhận" } }),
        el("td", { className: `c-profit r num${(o.profit ?? 0) < 0 ? " err" : ""}`, textContent: o.profit === undefined ? "thiếu giá vốn" : signed(o.profit), attrs: { "data-label": "Lãi" } }),
      ]), d);
    }
    body.replaceChildren(...rows);
    more.hidden = limit >= report.orders.length;
    more.textContent = `Xem thêm (còn ${report.orders.length - limit})`;
  };
  more.addEventListener("click", () => { limit += 30; draw(); });
  draw();
  section.append(
    el("table", { className: "ledger fin-orders" }, [
      el("thead", {}, el("tr", {}, ["Mã đơn", "Ngày", "Trạng thái", "Tiền hàng", "Phí, thuế", "Thực nhận", "Lãi"].map((t, i) => el("th", { className: i > 2 ? "r" : "", attrs: { scope: "col" }, textContent: t })))),
      body,
    ]),
    el("div", { className: "row-actions" }, more),
  );
  return section;
}

function walletSection(report) {
  const w = report.wallet;
  const short = shortfall(report, report.walletMissingDays);
  const amount = (text) => (short ? short.value : text);
  const section = el("section", { className: "fin" }, [
    el("h3", { textContent: "Ví Shopee" }),
    el("div", { className: "lines" }, [
      line("Tiền vào ví trong kỳ", amount(`${money(w.inflow)} ₫`), { neg: Boolean(short) }),
      line("Tiền ra khỏi ví trong kỳ", amount(`-${money(w.outflow)} ₫`), { sub: true, neg: Boolean(short) }),
      line("Trong đó rút về ngân hàng", amount(`${money(w.withdrawn)} ₫`), { sub: true, neg: Boolean(short) }),
    ]),
  ]);
  if (short) section.append(shortfallNote("Ví Shopee", "Giao dịch ví", short, short.partial && w.transactions.length ? ", bảng dưới chỉ có giao dịch của các ngày đó" : ""));
  if (!w.transactions.length) {
    // Chua lay duoc thi khong noi "khong co giao dich": ghi chu tren da noi ro.
    if (!short) section.append(el("p", { className: "empty", textContent: "Không có giao dịch ví trong kỳ." }));
    return section;
  }
  let limit = 20;
  const body = el("tbody");
  const more = el("button", { type: "button", className: "btn line sm" });
  const draw = () => {
    body.replaceChildren(...w.transactions.slice(0, limit).map((t) => el("tr", {}, [
      el("td", { className: "c-day num", textContent: when(t.time * 1000) }),
      el("td", { className: "c-name" }, [el("p", { textContent: t.title || t.type }), t.orderSn ? el("p", { className: "meta num", textContent: `Đơn ${t.orderSn}` }) : null]),
      el("td", { className: `c-amount r num${t.amount > 0 ? " ok" : ""}`, textContent: `${t.amount > 0 ? "+" : ""}${signed(t.amount)}`, attrs: { "data-label": "Số tiền" } }),
      el("td", { className: "c-balance r num", textContent: typeof t.balance === "number" ? money(t.balance) : "-", attrs: { "data-label": "Số dư sau" } }),
    ])));
    more.hidden = limit >= w.transactions.length;
    more.textContent = `Xem thêm (còn ${w.transactions.length - limit})`;
  };
  more.addEventListener("click", () => { limit += 30; draw(); });
  draw();
  section.append(
    el("table", { className: "ledger fin-wallet" }, [
      el("thead", {}, el("tr", {}, ["Lúc", "Nội dung", "Số tiền", "Số dư sau"].map((t, i) => el("th", { className: i > 1 ? "r" : "", attrs: { scope: "col" }, textContent: t })))),
      body,
    ]),
    el("div", { className: "row-actions" }, more),
  );

}

// ---------- Danh gia ----------

const STAR_PATH = "M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z";
function stars(n) {
  const NS = "http://www.w3.org/2000/svg";
  const wrap = el("span", { className: "stars", attrs: { role: "img", "aria-label": `${n} sao` } });
  for (let i = 1; i <= 5; i++) {
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", STAR_PATH);
    p.setAttribute("class", i <= n ? "on" : "off");
    svg.append(p);
    wrap.append(svg);
  }
  return wrap;
}

const REVIEW_FILTERS = [
  { id: "waiting", label: "Chờ duyệt", test: (r) => !r.replied && !r.hidden && !r.auto },
  { id: "auto", label: "Sẽ tự trả lời", test: (r) => !r.replied && r.auto },
  { id: "replied", label: "Đã trả lời", test: (r) => r.replied },
  { id: "all", label: "Tất cả", test: () => true },
];

async function renderReviews(force = false) {
  const content = $("content");
  content.replaceChildren(el("p", { className: "loading", textContent: force || !state.reviews
    ? "Đang lấy đánh giá từ Shopee..." : "Đang mở đánh giá..." }));
  try {
    const data = await api(`/api/reviews${force ? "?refresh=1" : ""}`);
    state.reviews = data;
    state.rvFilter ??= "waiting";
    state.rvStar ??= "all";
    drawReviews();
  } catch (error) {
    content.replaceChildren(problem(error.message, () => renderReviews(true)));
  }
}

function drawReviews(note) {
  const data = state.reviews;
  const s = data.settings;
  const content = $("content");
  const autoCount = data.reviews.filter((r) => !r.replied && r.auto).length;

  // Cong tac tu tra loi: shop that bam hai lan neu lan bat se gui ngay nhieu cau.
  const toggle = el("button", { type: "button", className: "switch", attrs: { role: "switch", "aria-checked": String(s.enabled) } }, [
    el("span", { className: "switch-track", attrs: { "aria-hidden": "true" } }, el("span", { className: "switch-thumb" })),
    el("span", { className: "switch-text" }, [el("strong", { textContent: "Tự trả lời 4-5 sao" }), el("span", { textContent: s.enabled ? "Đang bật" : "Đang tắt" })]),
  ]);
  const runNote = el("p", { className: "run-note", attrs: { role: "status" } });
  if (note) { runNote.className = `run-note ${note.kind}`; runNote.textContent = note.text; }
  let armed = false;
  toggle.addEventListener("click", async () => {
    const turningOn = !s.enabled;
    if (turningOn && autoCount && !state.status.sandbox && !armed) {
      armed = true;
      runNote.className = "run-note err";
      runNote.textContent = `Bật lên sẽ trả lời ngay ${autoCount} đánh giá 4-5 sao chưa có trả lời trên shop thật. Bấm công tắc lần nữa để bật.`;
      setTimeout(() => { armed = false; }, 8000);
      return;
    }
    toggle.disabled = true;
    try {
      await api("/api/reviews/settings", send("PUT", { enabled: turningOn }));
      s.enabled = turningOn;
      if (turningOn && autoCount) {
        runNote.className = "run-note";
        runNote.textContent = `Đang trả lời ${autoCount} đánh giá...`;
        const r = await api("/api/reviews/run", { method: "POST" });
        await renderReviews(true);
        drawReviews({ kind: r.failed.length ? "err" : "ok", text: r.message });
        return;
      }
      drawReviews();
    } catch (error) {
      toggle.disabled = false;
      runNote.className = "run-note err";
      runNote.textContent = error.message;
    }
  });
  const runNow = el("button", { type: "button", className: "btn line", textContent: "Kiểm tra ngay" });
  runNow.addEventListener("click", async () => {
    runNow.disabled = true;
    runNow.textContent = "Đang kiểm tra...";
    try {
      if (s.enabled) {
        const r = await api("/api/reviews/run", { method: "POST" });
        await renderReviews(true);
        drawReviews({ kind: r.failed.length ? "err" : "ok", text: r.message });
      } else {
        await renderReviews(true);
      }
    } catch (error) {
      runNow.disabled = false;
      runNow.textContent = "Kiểm tra ngay";
      runNote.className = "run-note err";
      runNote.textContent = error.message;
    }
  });

  const counts = Object.fromEntries(REVIEW_FILTERS.map((f) => [f.id, data.reviews.filter(f.test).length]));
  const chips = el("div", { className: "chips", attrs: { role: "group", "aria-label": "Lọc đánh giá" } },
    REVIEW_FILTERS.filter((f) => f.id !== "auto" || counts.auto).map((f) => {
      const b = el("button", { type: "button", className: "chip" }, [f.label, el("span", { className: "num chip-count", textContent: ` ${counts[f.id]}` })]);
      b.setAttribute("aria-pressed", String(state.rvFilter === f.id));
      b.addEventListener("click", () => { state.rvFilter = f.id; state.rvLimit = 20; drawReviews(); });
      return b;
    }));
  const starSel = el("select", { id: "rv-star", className: "sort-select" }, [
    el("option", { value: "all", textContent: "Mọi mức sao", selected: state.rvStar === "all" }),
    ...[5, 4, 3, 2, 1].map((n) => el("option", { value: String(n), textContent: `${n} sao`, selected: state.rvStar === String(n) })),
  ]);
  starSel.addEventListener("change", () => { state.rvStar = starSel.value; state.rvLimit = 20; drawReviews(); });

  const filter = REVIEW_FILTERS.find((f) => f.id === state.rvFilter) ?? REVIEW_FILTERS[0];
  const list = data.reviews.filter(filter.test).filter((r) => state.rvStar === "all" || String(r.rating) === state.rvStar);
  state.rvLimit ??= 20;

  const picks = new Map();
  const bulkBtn = el("button", { type: "button", className: "btn", hidden: true });
  const bulkNote = el("p", { className: "run-note", attrs: { role: "status" } });
  let bulkArmed = false;
  const bulkLabel = () => {
    const n = [...picks.values()].filter((p) => p.box.checked).length;
    bulkBtn.hidden = n === 0;
    bulkBtn.textContent = bulkArmed ? `Bấm lần nữa để gửi ${n} câu trả lời lên shop thật` : `Gửi ${n} câu trả lời đã chọn`;
    bulkBtn.classList.toggle("armed", bulkArmed);
  };
  bulkBtn.addEventListener("click", async () => {
    const chosen = [...picks.entries()].filter(([, p]) => p.box.checked);
    if (!state.status.sandbox && !bulkArmed) { bulkArmed = true; bulkLabel(); setTimeout(() => { bulkArmed = false; bulkLabel(); }, 6000); return; }
    bulkBtn.disabled = true;
    bulkBtn.textContent = "Đang gửi...";
    try {
      const { results } = await api("/api/reviews/reply", send("POST", { items: chosen.map(([id, p]) => ({ commentId: id, text: p.area.value })) }));
      applyResults(results, picks);
      const ok = results.filter((r) => r.ok).length;
      bulkNote.className = `run-note ${ok === results.length ? "ok" : "err"}`;
      bulkNote.textContent = `Đã gửi ${ok}/${results.length} câu trả lời.`;
    } catch (error) {
      bulkNote.className = "run-note err";
      bulkNote.textContent = error.message;
    } finally {
      bulkArmed = false;
      bulkBtn.disabled = false;
      bulkLabel();
    }
  });

  const entries = list.slice(0, state.rvLimit).map((r) => reviewEntry(r, picks, bulkLabel));
  const more = el("button", { type: "button", className: "btn line sm", hidden: list.length <= state.rvLimit, textContent: `Xem thêm (còn ${list.length - state.rvLimit})` });
  more.addEventListener("click", () => { state.rvLimit += 30; drawReviews(); });

  const loaded = new Date(data.loadedAt).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
  const every = s.checkMinutes > 0 ? `cứ ${s.checkMinutes} phút` : "định kỳ";
  content.replaceChildren(
    el("div", { className: "sheet-head" }, [
      el("h2", { textContent: "Đánh giá" }),
      el("p", { className: "soft num", textContent: `${money(data.reviews.length)} đánh giá gần nhất · số liệu lúc ${loaded}` }),
      el("span", { className: "grow" }),
      reloadButton(() => renderReviews(true)),
    ]),
    el("section", {}, [
      el("div", { className: "controls" }, [toggle, runNow]),
      el("p", { className: "explain", textContent: `Khi bật, ${every} hệ thống xem đánh giá mới: đánh giá 4-5 sao trong ${s.autoDays} ngày gần nhất chưa có trả lời được trả lời theo mẫu. Đánh giá 1-3 sao và đánh giá cũ hơn nằm ở mục Chờ duyệt để anh chị đọc, sửa rồi gửi. Chỉ chạy khi máy chủ đang chạy.` }),
      el("p", { className: "explain" }, ["Lần chạy gần nhất: ", el("strong", { textContent: timeAgo(s.lastRunAt) }), s.lastResult ? ` - ${s.lastResult}` : ""]),
      runNote,
    ]),
    el("section", {}, [
      el("div", { className: "toolbar rv-tools" }, [chips, el("span", { className: "grow" }), el("label", { className: "tool" }, [el("span", { className: "sr", textContent: "Lọc theo số sao" }), el("span", { className: "tool-field" }, [starSel, icon("chevron")])])]),
      list.length
        ? el("ol", { className: "rv-list" }, entries)
        : el("p", { className: "empty", textContent: filter.id === "waiting" ? "Không có đánh giá nào chờ duyệt." : "Không có đánh giá nào ở mục này." }),
      el("div", { className: "row-actions" }, [more]),
      el("div", { className: "apply-bar" }, [bulkBtn, bulkNote]),
    ]),
    templateSection(s),
  );
}

function reviewEntry(r, picks, onPick) {
  const head = el("div", { className: "rv-head" }, [
    stars(r.rating),
    el("span", { className: "rv-item", textContent: r.itemName }),
    el("span", { className: "meta num", textContent: `${viDay(hnDay(r.createTime * 1000))}${r.orderSn ? " · đơn " + r.orderSn : ""}` }),
  ]);
  const body = [
    head,
    el("p", { className: `rv-text${r.text ? "" : " soft"}`, textContent: r.text || "(Khách chỉ chấm sao, không viết nhận xét.)" }),
  ];
  if (r.images.length) {
    body.push(el("div", { className: "rv-images" }, r.images.slice(0, 4).map((src) => el("img", { src, alt: "Ảnh khách gửi", loading: "lazy", className: "thumb" }))));
  }
  if (r.hidden) body.push(el("p", { className: "meta", textContent: "Đánh giá này đang bị ẩn." }));

  if (r.replied) {
    body.push(el("div", { className: "rv-reply" }, [
      el("p", { className: "rv-reply-label" }, [
        "Shop đã trả lời",
        r.replyTime ? ` lúc ${when(r.replyTime * 1000)}` : "",
        r.byUs ? el("span", { className: "rv-by", textContent: r.byUs.auto ? " · tự động" : " · gửi từ trang này" }) : "",
      ]),
      el("p", { className: "rv-reply-text", textContent: r.reply }),
    ]));
    return el("li", { className: "rv" }, body);
  }

  const id = `rv-${r.commentId}`;
  const area = el("textarea", { id, className: "rv-area", rows: 3, maxLength: 500, value: r.draft ?? "" });
  const count = el("span", { className: "meta num rv-count" });
  const updateCount = () => { count.textContent = `${area.value.trim().length}/500`; };
  area.addEventListener("input", updateCount);
  updateCount();
  const box = el("input", { type: "checkbox" });
  box.setAttribute("aria-label", `Chọn để gửi hàng loạt: đánh giá ${r.rating} sao về ${r.itemName}`);
  box.addEventListener("change", onPick);
  const sendBtn = el("button", { type: "button", className: "btn sm", textContent: "Gửi trả lời" });
  const msg = el("p", { className: "fix-note", attrs: { role: "status" } });
  picks.set(r.commentId, { box, area, sendBtn, msg, entry: null });
  sendBtn.addEventListener("click", async () => {
    sendBtn.disabled = true;
    sendBtn.textContent = "Đang gửi...";
    try {
      const { results } = await api("/api/reviews/reply", send("POST", { items: [{ commentId: r.commentId, text: area.value }] }));
      applyResults(results, picks);
    } catch (error) {
      msg.className = "fix-note err";
      msg.replaceChildren(...note("err", error.message));
      sendBtn.disabled = false;
      sendBtn.textContent = "Gửi trả lời";
    }
  });

  body.push(
    el("label", { className: "rv-label", htmlFor: id }, ["Câu trả lời", r.auto ? el("span", { className: "rv-by", textContent: state.reviews.settings.enabled ? " · sẽ tự gửi ở lần kiểm tra tới" : " · sẽ tự gửi khi bật tự trả lời" }) : ""]),
    area,
    el("div", { className: "rv-actions" }, [
      el("label", { className: "tick" }, [box, el("span", { className: "tick-box", attrs: { "aria-hidden": "true" } }, icon("tick")), el("span", { className: "tick-text rv-tick", textContent: "Chọn" })]),
      count,
      el("span", { className: "grow" }),
      sendBtn,
    ]),
    msg,
  );
  const li = el("li", { className: "rv" }, body);
  picks.get(r.commentId).entry = li;
  return li;
}

/** Danh dau ket qua gui tren tung danh gia; gui xong thi khoa o nhap. */
function applyResults(results, picks) {
  for (const res of results) {
    const p = picks.get(res.commentId);
    if (!p) continue;
    p.msg.className = `fix-note ${res.ok ? "ok" : "err"}`;
    p.msg.replaceChildren(...note(res.ok ? "ok" : "err", res.ok ? `Đã gửi lúc ${clock()}.` : `Shopee chưa nhận: ${res.message}`));
    if (res.ok) {
      p.area.readOnly = true;
      p.box.checked = false;
      p.box.disabled = true;
      p.sendBtn.remove();
      const r = state.reviews.reviews.find((x) => x.commentId === res.commentId);
      if (r) { r.replied = true; r.reply = p.area.value.trim(); r.replyTime = Math.floor(Date.now() / 1000); r.byUs = { auto: false }; }
    } else {
      p.sendBtn.disabled = false;
      p.sendBtn.textContent = "Gửi trả lời";
    }
  }
}

function templateSection(s) {
  const lists = {};
  const wrap = el("div", { className: "tpl-grid" });
  for (const star of ["5", "4", "3", "2", "1"]) {
    const box = el("div", { className: "tpl-list" });
    lists[star] = box;
    const addArea = (text) => {
      const area = el("textarea", { className: "rv-area", rows: 3, maxLength: 500, value: text });
      area.setAttribute("aria-label", `Mẫu trả lời ${star} sao`);
      const remove = el("button", { type: "button", className: "link", textContent: "Xóa mẫu này" });
      const row = el("div", { className: "tpl-row" }, [area, remove]);
      remove.addEventListener("click", () => row.remove());
      box.append(row);
    };
    s.templates[star].forEach(addArea);
    const add = el("button", { type: "button", className: "link ink", textContent: "Thêm mẫu" });
    add.addEventListener("click", () => addArea(""));
    wrap.append(el("div", { className: "tpl-star" }, [el("h4", {}, [stars(Number(star)), el("span", { textContent: ` ${star} sao` })]), box, add]));
  }
  const save = el("button", { type: "button", className: "btn", textContent: "Lưu mẫu" });
  const msg = el("p", { className: "run-note", attrs: { role: "status" } });
  save.addEventListener("click", async () => {
    const templates = Object.fromEntries(Object.entries(lists).map(([star, box]) => [star, [...box.querySelectorAll("textarea")].map((a) => a.value)]));
    save.disabled = true;
    try {
      const r = await api("/api/reviews/settings", send("PUT", { templates }));
      state.reviews.settings.templates = r.templates;
      msg.className = "run-note ok";
      msg.textContent = "Đã lưu mẫu. Các câu soạn sẵn ở mục Chờ duyệt dùng mẫu mới khi tải lại.";
    } catch (error) {
      msg.className = "run-note err";
      msg.textContent = error.message;
    } finally {
      save.disabled = false;
    }
  });
  return el("details", { className: "tpl" }, [
    el("summary", { textContent: "Mẫu trả lời theo số sao" }),
    el("p", { className: "explain", textContent: "Mỗi mức sao có thể có nhiều mẫu, mỗi đánh giá được gán một mẫu cố định để các câu trả lời không trùng nhau. Viết {shop} để chèn tên shop, {san_pham} để chèn tên sản phẩm rút gọn. Tối đa 500 ký tự mỗi mẫu." }),
    wrap,
    el("div", { className: "apply-bar" }, [save, msg]),
  ]);
}

// ---------- Chuyen trang ----------

const TABS = [
  { id: "products", label: "Sản phẩm", icon: "tag", render: () => renderProducts() },
  { id: "bulk", label: "Sửa hàng loạt", short: "Hàng loạt", icon: "sheet", render: renderBulk },
  { id: "finance", label: "Tài chính", icon: "coins", render: () => renderFinance() },
  { id: "reviews", label: "Đánh giá", icon: "chat", render: () => renderReviews() },
  { id: "boost", label: "Đẩy sản phẩm", short: "Đẩy", icon: "boost", render: renderBoost },
];

function readSavedTab() {
  try { return localStorage.getItem("tab"); } catch { return null; }
}

function showTab(id) {
  const tab = TABS.find((t) => t.id === id) ?? TABS[0];
  try { localStorage.setItem("tab", tab.id); } catch { /* trinh duyet chan luu tru, bo qua */ }
  const nav = $("tabs");
  nav.textContent = "";
  for (const t of TABS) {
    // Dien thoai hien nhan ngan cho vua 5 the; ten day du van doc duoc qua aria-label.
    const button = el("button", { type: "button", className: "tab", attrs: { "aria-label": t.label } }, [
      icon(t.icon),
      el("span", { className: "tab-long", textContent: t.label }),
      el("span", { className: "tab-short", textContent: t.short ?? t.label }),
    ]);
    if (t.id === tab.id) button.setAttribute("aria-current", "page");
    button.addEventListener("click", () => showTab(t.id));
    nav.append(button);
  }
  window.scrollTo(0, 0);
  tab.render();
}

(async () => {
  const params = new URLSearchParams(location.search);
  if (params.has("connected")) {
    state.connectedBanner = true;
    history.replaceState(null, "", location.pathname);
  }
  state.sort = SORTS.some((x) => x.id === readPref("sort", "")) ? readPref("sort", "") : "recent";
  const status = await loadStatus();
  if (!status) return;
  if (!status.connected) {
    renderConnect();
    return;
  }
  loadShopName();
  showTab(readSavedTab());
})();
</script>
